- aid: cumulocity:cumulocity-device-statistics-api
  name: Cumulocity Device statistics API
  description: "Device statistics are collected for each inventory object with at least one measurement,\
    \ event or alarm. There are no additional checks if the inventory object is marked as device using\
    \ the `c8y_IsDevice` fragment. When the first measurement, event or alarm is created for a specific\
    \ inventory object, Cumulocity is always considering this as a device and starts counting.\n\nDevice\
    \ statistics are counted with daily and monthy rate. All requests are considered when counting device\
    \ statistics, no matter which processing mode is used.\n\nThe following requests are counted:\n\n\
    * Alarm creation and update\n* Event creation and update\n* Measurement creation\n* Bulk measurement\
    \ creation is counted as multiple requests\n* Bulk alarm status update is counted as multiple requests\n\
    * MQTT and SmartREST requests with multiple rows are counted as multiple requests\n\n### Frequently\
    \ asked questions\n\n#### Are operations on device firmware counted?\n\n**No**, device configuration\
    \ and firmware update operate on inventory objects, hence they are not counted.\n\n#### Are requests\
    \ done by the UI applications, for example, when browsing device details, counted?\n\n**No**, viewing\
    \ device details performs only GET requests which are not counted.\n\n#### Is the clear alarm operation\
    \ done from the UI counted?\n\n**Yes**, a clear alarm operation in fact performs an alarm update operation\
    \ and it will be counted as device request.\n\n#### Is there any operation performed on the device\
    \ which is counted?\n\n**Yes**, retrieving device logs requires from the device to create an event\
    \ and attach a binary with logs to it. Those are two separate requests and both are counted.\n\n####\
    \ When I have a device with children are the requests counted always to the root device or separately\
    \ for each child?\n\nSeparately for each child.\n\n#### Why do device statistics show significantly\
    \ smaller request numbers than the total number of created and updated request from usage statistics?\n\
    \nThe important aspect here is the moment of recording values for the counters. For inbound data usage\
    \ statistics we count every request that passed authorization, including invalid requests, as stated\
    \ in usage statistics description.\n\nFor device statistics it is different. We count requests after\
    \ data is successfully stored in the database (or transient), which means the request was valid and\
    \ there was no problem with persistence. \n\nIn summary, if you observe that your usage statistics\
    \ counters are significantly larger than your device statistics counters, there is a good chance that\
    \ some devices or microservices in your tenant are constantly sending invalid requests. In such a\
    \ situation, the client should check the state of theirs tenant."
  humanURL: https://cumulocity.com/docs/device-integration/mqtt/
  baseURL: mqtt://{tenant}.cumulocity.com:1883
  tags:
  - Device statistics
  properties:
  - type: OpenAPI
    url: openapi/cumulocity-device-statistics-api-openapi.yml

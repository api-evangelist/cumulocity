- aid: cumulocity:cumulocity-usage-statistics-api
  name: Cumulocity Usage statistics API
  description: "Days are counted according to server timezone, so be aware that the tenant usage statistics\
    \ displaying/filtering may not work correctly when the client is not in the same timezone as the server.\
    \ However, it is possible to send a request with a time range (using the query parameters `dateFrom`\
    \ and `dateTo`) in zoned format (for example, `2020-10-26T03:00:00%2B01:00`). Statistics from past\
    \ days are stored with daily aggregations, which means that for a specific day you get either the\
    \ statistics for the whole day or none at all.\n\n### Request counting in SmartREST and MQTT\n\n*\
    \ SmartREST: Each row in a SmartREST request is transformed into a separate HTTP request. For example,\
    \ if one SmartREST request contains 10 rows, then 10 separate calls are executed, meaning that request\
    \ count is increased by 10.\n* MQTT: Each row/line counts as a separate request. Creating custom template\
    \ counts as a single request.\n\n### REST specific counting details\n\n* All counters increase also\
    \ when the request is invalid, for example, wrong payload or missing permissions.\n* Bulk measurements\
    \ creation and bulk alarm status update are counted as a single \"requestCount\"/\"deviceRequestCount\"\
    \ and multiple inbound data transfer count.\n\n### SmartREST 1.0 specific counting details\n\n* Invalid\
    \ SmartREST requests are not counted, for example, when the template doesn't exist.\n* A new template\
    \ registration is treated as two separate requests. Create a new inventory object which increases\
    \ \"requestCount\", \"deviceRequestCount\" and \"inventoriesCreatedCount\". There is also a second\
    \ request which binds the template with X-ID, this increases \"requestCount\" and \"deviceRequestCount\"\
    .\n* Each row in a SmartREST request is transformed into a separate HTTP request. For example, if\
    \ one SmartREST request contains 10 rows, then 10 separate calls are executed, meaning that both \"\
    requestCount\" and \"deviceRequestCount\" are increased by 10.\n\n### MQTT specific counting details\n\
    \n* Invalid requests are counted, for example, when sending a message with a wrong template ID.\n\
    * Device creation request and automatic device creation are counted.\n* Each row/line counts as a\
    \ separate request.\n* Creating a custom template counts as a single request, no matter how many rows\
    \ are sent in the request.\n* There is one special SmartREST 2.0 template (402 Create location update\
    \ event with device update) which is doing two things in one call, that is, create a new location\
    \ event and update the location of the device. It is counted as two separate requests.\n\n### JSON\
    \ via MQTT specific counting details\n\n* Invalid requests are counted, for example, when the message\
    \ payload is invalid.\n* Bulk creation requests are counted as a single \"requestCount\"/\"deviceRequestCount\"\
    \ and multiple inbound data transfer count.\n* Bulk creation requests with a wrong payload are not\
    \ counted for inbound data transfer count.\n\n### Notifications 2.0 specific counting details\n\n\
    * Invalid requests are counted, for example, unsuccessful subscription.\n* All Notifications 2.0 subscription\
    \ API requests are counted.\n* All Notifications 2.0 token API requests are counted.\n* Notifications\
    \ 2.0 WebSocket consumer connection requests are not counted.\n* Messages delivered over Notifications\
    \ 2.0 WebSocket connections are not counted.\n\n### Total inbound data transfer\n\nInbound data transfer\
    \ refers to the total number of inbound requests performed to transfer data into the Cumulocity platform.\
    \ This includes sensor readings, alarms, events, commands and alike that are transferred between devices\
    \ and the Cumulocity platform using the REST and/or MQTT interfaces. Such an inbound request could\
    \ also originate from a custom microservice, website or any other client.\n\nSee the table below for\
    \ more information on how the counters are increased. Additionally, it shows how inbound data transfers\
    \ are handled for both MQTT and REST:\n\n| Type of transfer                                      \
    \                                         | MQTT counter information                             \
    \                                                                                                \
    \                              | REST counter information                                        \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                   |\n|:-----------------------------------------------------------------------------------------------|:-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|:---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
    | Creation of an **alarm** in one request                                                        |\
    \ One alarm creation is counted.                                                                 \
    \                                                                                    | One alarm creation\
    \ is counted via REST.                                                                           \
    \                                                                                                \
    \                                                                                                \
    \                                                                                 |\n| Update of an\
    \ **alarm** (for example, status change)                                            | One alarm update\
    \ is counted.                                                                                    \
    \                                                                   | One alarm update is counted\
    \ via REST.                                                                                      \
    \                                                                                                \
    \                                                                                                \
    \                                                                        |\n| Creation of **multiple\
    \ alarms** in one request                                                 | Each alarm creation in\
    \ a single MQTT request will be counted.                                                         \
    \                                                             | Not supported by C8Y (REST does not\
    \ support creating multiple alarms in one call).                                                 \
    \                                                                                                \
    \                                                                                                \
    \                                                                |\n| Update of **multiple alarms**\
    \ (for example, status change) in one request                      | Each alarm update in a single\
    \ MQTT request will be counted.                                                                  \
    \                                                      | Each alarm that matches the filter is counted\
    \ as an alarm update (causing multiple updates).                                                 \
    \                                                                                                \
    \                                                                                                \
    \                                                      |\n| Creation of an **event** in one request\
    \                                                        | One event creation is counted.        \
    \                                                                                                \
    \                                             | One event creation is counted.                   \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                  |\n| Update of an **event** (for example, text\
    \ change)                                              | One event update is counted.            \
    \                                                                                                \
    \                                           | One event update is counted.                       \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                |\n| Creation of **multiple events** in one request\
    \                                                 | Each event creation in a single MQTT request will\
    \ be counted.                                                                                    \
    \                                  | Not supported by C8Y (REST does not support creating multiple\
    \ events in one call).                                                                           \
    \                                                                                                \
    \                                                                                                \
    \                                      |\n| Update of **multiple events** (for example, text change)\
    \ in one request                        | Each event update in a single MQTT request will be counted.\
    \                                                                                                \
    \                        | Not supported by C8Y (REST does not support updating multiple events in\
    \ one call).                                                                                     \
    \                                                                                                \
    \                                                                                                \
    \                            |\n| Creation of a **measurement** in one request                   \
    \                                | One measurement creation is counted.                          \
    \                                                                                                \
    \                     | One measurement creation is counted.                                     \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                          |\n| Creation of **multiple measurements** in one request             \
    \                              | Each measurement creation in a single MQTT request will be counted.\
    \ Example: If MQTT is used to report 5 measurements, the measurementCreated counter will be incremented\
    \ by five. | REST allows multiple measurements to be created by sending multiple measurements in one\
    \ call. In this case, each measurement sent via REST is counted individually. The call itself is not\
    \ counted. For example, if somebody sends 5 measurements via REST in one call, the corresponding counter\
    \ will be increased by 5. Measurements with multiple series are counted as a singular measurement.\
    \ |\n| Creation of a **managed object** in one request                                           \
    \     | One managed object creation is counted.                                                  \
    \                                                                                          | One managed\
    \ object creation is counted.                                                                    \
    \                                                                                                \
    \                                                                                                \
    \                                                                                        |\n| Update\
    \ of one **managed object** (for example, status change)                                  | One managed\
    \ object update is counted.                                                                      \
    \                                                                        | One managed object update\
    \ is counted.                                                                                    \
    \                                                                                                \
    \                                                                                                \
    \                                                                          |\n| Update of **multiple\
    \ managed objects** in one request                                          | Each managed object\
    \ update in a single MQTT request will be counted.                                               \
    \                                                                | Not supported by C8Y (REST does\
    \ not support updating multiple managed objects in one call).                                    \
    \                                                                                                \
    \                                                                                                \
    \                                                                    |\n| Creation/update of **multiple\
    \ alarms/measurements/events/inventories** mixed in a single call. | Each MQTT line is processed separately.\
    \ If it is a creation/update of an event/alarm/measurement/inventory, the corresponding counter is\
    \ increased by one.                         | Not supported by the REST API.                     \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                |\n| Assign/unassign of **child devices and child\
    \ assets** in one request                           | One managed object update is counted.      \
    \                                                                                                \
    \                                        | One managed object update is counted.                 \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                             |\n| Creation of an **operation** in one request   \
    \                                                 | One operation creation is counted.           \
    \                                                                                                \
    \                                      | One operation creation is counted.                      \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                           |\n| Update of an **operation** (for example, status change)\
    \                                        | One operation update is counted.                      \
    \                                                                                                \
    \                             | One operation update is counted.                                 \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                  |\n\n### Microservice usage statistics\n\nThe microservice usage\
    \ statistics gathers information on the resource usage for tenants for each subscribed application\
    \ which are collected on a daily base.\n\nThe microservice usage's information is stored in the `resources`\
    \ object.\n\n### Frequently asked questions\n\n#### Which requests are counted as general \"requestCount\"\
    ?\n\nAll requests which the platform receives are counted, including,for example, UI requests, microservices\
    \ requests, device requests and agents requests. Only a few internal endpoints are not counted:\n\
    * `/health` (and all endpoints including this URI fragment, like `/tenant/health`)\n* `/application/currentApplication`\
    \ (and all subresources, like `/application/currentApplication/subscriptions`)\n* `/tenant/limit`\n\
    * `/devicecontrol/deviceCredentials`\n* `/inventory/templates` (and all subresources)\n\n#### My devices\
    \ are not sending any data, but \"requestCount\" is increasing, and the total number is really big.\
    \ Why is this happening?\n\nNot only device requests are counted. Every user interaction with UI applications\
    \ generates some requests to the backend API. Additionally you may have subscribed standard or custom\
    \ microservices, which also regularly send requests to the platform.\n\nExample: If you have four\
    \ microservices and each microservice sends five requests per minute, this setup creates `4 * 5 *\
    \ 60 * 24 = 28800` requests per day. Similar numbers arise if there are multiple users working with\
    \ the given tenant UI concurrently. \n\n#### Which requests are counted as \"deviceRequestCount\"\
    ?\n\nAll requests from \"requestCount\" except the following:\n\n* Tenant API requests\n* Application\
    \ API requests\n* User API requests\n* Requests with the proper HTTP header `X-Cumulocity-Application-Key`,\
    \ matching the application key of one of the applications used by a particular tenant \n\nThe exclusion\
    \ of the APIs in the list above means that requests to endpoints which start with the mentioned API\
    \ prefixes are not counted. For example, for the Tenant API the following endpoints are not counted\
    \ (the list is incomplete):\n* `/tenant/tenants`\n* `/tenant/currentTenant`\n* `/tenant/statistics`\n\
    * `/tenant/options`\n\n> **&#9432; Info:** Each microservice and web application must include the\
    \ `X-Cumulocity-Application-Key` header in all requests.\n> Otherwise such requests are counted as\
    \ device requests which incorrectly affects the \"deviceRequestCount\" usage metric."

    An audit log stores events that are security-relevant and should be stored for auditing. For example,
    an audit log should be generated when a user logs into a gateway.


    An audit log extends an event through:


    * A username of the user that carried out the activity.

    * An application that was used to carry out the activity.

    * The actual activity.

    * A severity.



- aid: cumulocity:cumulocity-device-permissions-api
  name: Cumulocity Device Permissions API
  description: >-
    API methods to retrieve and update device permissions assignments.


    Device permissions enable users to access and manipulate devices.


    The device permission structure is **[API:fragment_name:permission]** where:


    * **API** is one of the following values: OPERATION, ALARM, AUDIT, EVENT, MANAGED_OBJECT, MEASUREMENT
    or "*"

    * **fragment_name** can be the name of any fragment, for example, "c8y_Restart" or "*"

    * **permission** is ADMIN, READ or "*"


    Required permission per HTTP method:


    + GET - READ or "*"

    + PUT - ADMIN or "*"


    The wildcard "*" enables you to access every API and stored object regardless of the fragments that
    are inside it.


    > **⚠️ Important:** If there is no fragment in an object, for example, to read the object, you must
    use the wildcard "*" for the **fragment_name** part of the device permission (see the structure above).
    For example: `"10200":["MEASUREMENT:*:READ"]`.
  humanURL: https://cumulocity.com/docs/device-integration/mqtt/
  baseURL: mqtt://{tenant}.cumulocity.com:1883

openapi: 3.2.0
info:
  version: Latest
  title: Cumulocity Measurements API
  x-logo:
    url: https://www.cumulocity.com/docs/images/logo-platform.svg
    backgroundColor: '#F8F8F8'
    altText: Cumulocity
    href: https://www.cumulocity.com/api
  description: '# REST implementation


    This section describes the aspects common to all REST-based interfaces of Cumulocity. The interfaces are based on the Hypertext Transfer Protocol 1.1 using HTTPS. ## HTTP usage


    ### Application management


    Cumulocity uses a so-called "application key" to distinguish requests coming from devices and traffic from applications. If you write an application, pass the following header as part of all requests:


    ```markup

    X-Cumulocity-Application-Key:

    ```


    For example, if you registered your application in the Cumulocity Administration application with the key "myapp", your requests should contain the header:


    ```markup

    X-Cumulocity-Application-Key: myapp

    ```


    This makes your application subscribable and billable. If you implement a device, do not pass the key. > **ⓘ Info:** Make sure that you pass the key in **all** requests coming from an application. If you leave out the key,

    > the request will be considered as a device request, and the corresponding device will be marked as "available". ### Limited HTTP clients


    If you use an HTTP client that can only perform GET and POST methods in HTTP, you can emulate the other methods through an additional "X-HTTP-METHOD" header. Simply issue a POST request and add the header, specifying the actual REST method to be executed. For example, to emulate the "PUT" (modify) method, you can use:


    ```http

    POST ... X-HTTP-METHOD: PUT

    ```


    ### Processing mode


    Every update request (PUT, POST, DELETE) executes with a so-called *processing mode*. The processing modes are as follows:


    |Processing mode|Description|

    |---|---|

    |PERSISTENT (default)|Stores data in the Cumulocity database and sends data to the Streaming Analytics engine. Afterwards, Cumulocity returns the result of the request. This is the default mode.|

    |TRANSIENT|Sends data to the Streaming Analytics engine and immediately returns the results asynchronously but does not store data in Cumulocity’s database. This mode saves storage and processing costs and is useful for example when tracking devices in real time without requiring data to be stored.|

    |QUIESCENT|Behaves similar to the persistent mode with the exception that no real-time notifications will be sent.|

    |CEP|Behaves like the transient mode with the exception that no real-time notifications are sent.|


    To explicitly control the processing mode of an update request, you can use the "X-Cumulocity-Processing-Mode" header with a value of either "PERSISTENT", "TRANSIENT", "QUIESCENT" or "CEP":


    ```markup

    X-Cumulocity-Processing-Mode: PERSISTENT

    ```


    > **ⓘ Info:** Events are always delivered to CEP/Apama for all processing modes. This is independent from real-time notifications. ### Authorization


    All requests issued to Cumulocity are subject to authorization. To determine the required permissions, see the "Required role" entries for the individual requests. To learn more about the different permissions and the concept of ownership in Cumulocity, see Getting started > Technical concepts > Security aspects > Access control > Managing roles and assigning permissions in the Cumulocity user documentation. > **⚠️ Important:** In the Cumulocity API, each granular permission is identified by a unique “permission” string, which is prefixed with ROLE_ (for example, ROLE_ALARM_READ, ROLE_INVENTORY_ADMIN). Therefore, permissions are frequently referred to as “roles” throughout the API as well as in the configuration files. For example, the microservice manifest includes a requiredRoles field, which actually expects a permission string. See also the Glossary of the Cumulocity user documentation for the usage of the terms “permission” and “role” in the Cumulocity context. ### Media types


    Each type of data is associated with an own media type. The general format of media types is:


    ```markup

    application/vnd.com.nsn.cumulocity.+json;ver=;charset=UTF-8

    ```


    Each media type contains a parameter `ver` indicating the version of the type.'
servers:
- description: Cumulocity tenant
  url: https://<TENANT_DOMAIN>
security:
- Basic: []
- OAI-Secure: []
- SSO: []
- JWT-IAM: []
tags:
- name: Measurements
  description: 'Measurements are produced by reading sensor values. In some cases, this data is read in static intervals and sent to the platform (for example, temperature sensors or electrical meters). In other cases, the data is read on demand or at irregular intervals (for example, health devices such as weight scales). Regardless what kind of protocol the device supports, the agent is responsible for converting it into a "push" protocol by uploading data to Cumulocity.


    > **ⓘ Info:** The Accept header should be provided in all POST requests, otherwise an empty response body will be returned.'
paths:
  /measurement/measurements:
    post:
      operationId: postMeasurementCollectionResource
      x-codegen-resource-name: createMeasurement
      parameters:
      - $ref: '#/components/parameters/acceptHeader'
      - $ref: '#/components/parameters/processingModeHeader'
      tags:
      - Measurements
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Create a measurement
      description: 'A measurement must be associated with a source (managed object) identified by ID, and must specify the type of measurement and the time when it was measured by the device (for example, a thermometer). Each measurement fragment is an object (for example, `c8y_Steam`) containing the actual measurements as properties. The property name represents the name of the measurement (for example, `Temperature`) and it contains two properties:


        * `value` - The value of the individual measurement. The maximum precision for floating point numbers is 64-bit IEEE 754. For integers it''s a 64-bit two''s complement integer. The `value` is mandatory for a fragment. * `unit` - The unit of the measurements. This field is optional in the request body; however, if it is provided, it must be a non-empty string and must not be null. Review the System of units section for details about the conversions of units. Also review Getting started > Technical concepts > Cumulocity''s domain model > Inventory > Fragments > Naming conventions of fragments in the Cumulocity user documentation. The example below uses `c8y_SteamFragment` in the request body to illustrate recording two measurements called `Temperature` and `Humidity`. ```json

        {

        "source": { "id": "681200" },

        "time": "2020-03-19T12:03:27.845Z",

        "type": "temperatureMeasurement",

        "c8y_SteamFragment": {

        "Temperature": { "value": 42.7, "unit": "C" },

        "Humidity": { "value": 13.37, "unit": "%RH" }

        }

        }

        ```


        > **⚠️ Important:** Property names used for fragment and series must not contain whitespaces nor the special characters `. , * [ ] ( ) @ $`. This is required to ensure a correct processing. **Legacy compatibility:**


        For legacy compatibility reasons, a measurement can contain custom fragments. The platform''s behavior will vary based on whether the series in the custom fragment are valid or not:


        1. ***Mixed Series Fragments:***


        When creating a measurement with a fragment containing both valid and invalid series:

        - Valid series (those with numeric value fields) are processed and persisted. - Invalid series (e.g., Booleans, Lists, Strings, Structs) are silently ignored and are not included in the resulting measurement. - The measurement is created successfully (HTTP 201 Created), but the invalid series are removed. **Example:**

        ```json

        {

        "source": { "id": "681200" },

        "time": "2020-03-19T12:03:27.845Z",

        "type": "temperatureMeasurement",

        "c8y_SteamFragment": {

        "validSeries_DOUBLE": { "value": 3.141592653589793, "unit": "RAD" },

        "validSeries_INTEGER": { "value": 42, "unit": "C" },

        "ignoredField_BOOLEAN": { "value": false, "unit": "t/f" },

        "ignoredField_LIST": { "value": [42, 43, 44] },

        "ignoredField_STRUCT": { "value": { "a": 1, "b": 2 }, "unit": "C" },

        "ignoredField0": 42,

        "ignoredField1": { "value": { "a": 1, "b": 2 }, "unit": "C" },

        "ignoredField2": { "unit": "C" },

        "ignoredField3": { "val": 42 },

        "ignoredField4": { "subseries": { "value": 42 } }

        }

        }

        ```


        **Response:**

        ```json

        {

        "self": "https://example.cumulocity.com/measurement/measurements/124",

        "id": "124",

        "type": "temperatureMeasurement",

        "source": { "id": "681200" },

        "time": "2020-03-19T12:03:27.845Z",

        "c8y_SteamFragment": {

        "validSeries_DOUBLE": { "value": 3.141592653589793, "unit": "RAD" },

        "validSeries_INTEGER": { "value": 42, "unit": "C" }

        }

        }

        ```


        2. ***Fragments with Only Invalid Series:***


        If a measurement fragment contains only invalid series, the entire fragment is preserved as a plain object, and no fields are removed or validated further. This means that such fragments are treated as normal document properties rather than as series fragments. As a result:

        - These objects are not included in series fragment aggregation. - They are not treated as part of the measurement''s series data but remain accessible as regular property within the measurement document.'
      requestBody:
        required: true
        content:
          application/vnd.com.nsn.cumulocity.measurement+json:
            schema:
              $ref: '#/components/schemas/measurement'
            example:
              source:
                id: '251982'
              time: '2020-03-19T12:03:27.845Z'
              type: c8y_TemperatureMeasurement
              c8y_Steam:
                Temperature:
                  unit: C
                  value: 100
          application/vnd.com.nsn.cumulocity.measurementcollection+json:
            schema:
              $ref: '#/components/schemas/MeasurementCollection'
            example:
              measurements:
              - source:
                  id: '251982'
                time: '2020-03-19T12:03:27.845Z'
                type: c8y_TemperatureMeasurement
                c8y_Steam:
                  Temperature:
                    unit: C
                    value: 100
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request POST "https://<TENANT_DOMAIN>/measurement/measurements" \

          --header "Authorization: Basic <AUTHORIZATION>" \

          --header "Accept: application/json" \

          --header "Content-Type: application/json" \

          --data-raw ''<Payload>''

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/measurement/measurements");

          client.Timeout = -1;


          var request = new RestRequest(Method.POST);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");

          request.AddHeader("Content-Type", "application/json");

          request.AddHeader("Accept", "application/json");

          request.AddParameter("application/json", "<Payload>",  ParameterType.RequestBody);


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.post(\"https://<TENANT_DOMAIN>/measurement/measurements\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .header(\"Content-Type\", \"application/json\")\n    .header(\"Accept\", \"application/json\")\n    .body(\"<Payload>\")\n    .asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"POST\", \"https://<TENANT_DOMAIN>/measurement/measurements\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\",\n        \"Accept\": \"application/json\",\n        \"Content-Type\": \"application/json\"\n    })\n    .send(JSON.stringify( <Payload> ))\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\nimport json\n\nurl = \"https://<TENANT_DOMAIN>/measurement/measurements\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\",\n  \"Accept\": \"application/json\",\n  \"Content-Type\": \"application/json\"\n}\nresponse = requests.request(\"POST\", url, headers=headers, data = json.dumps(<Payload>))\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '201':
          description: A measurement was created.
          content:
            application/vnd.com.nsn.cumulocity.measurement+json:
              schema:
                $ref: '#/components/schemas/measurement'
            application/vnd.com.nsn.cumulocity.measurementcollection+json:
              schema:
                $ref: '#/components/schemas/MeasurementCollection'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '422':
          $ref: '#/components/responses/invalidBulkPayload'
    get:
      operationId: getMeasurementCollectionResource
      x-codegen-resource-name: getMeasurements
      parameters:
      - $ref: '#/components/parameters/queryParam_currentPage'
      - $ref: '#/components/parameters/queryParam_measurement_dateFrom'
      - $ref: '#/components/parameters/queryParam_measurement_dateTo'
      - $ref: '#/components/parameters/queryParam_pageSize'
      - $ref: '#/components/parameters/queryParam_measurement_revert'
      - $ref: '#/components/parameters/queryParam_measurement_source'
      - $ref: '#/components/parameters/queryParam_measurement_type'
      - $ref: '#/components/parameters/queryParam_measurement_valueFragmentSeries'
      - $ref: '#/components/parameters/queryParam_measurement_valueFragmentType'
      - $ref: '#/components/parameters/queryParam_withTotalElements'
      - $ref: '#/components/parameters/queryParam_withTotalPages'
      tags:
      - Measurements
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Retrieve all measurements
      description: 'Retrieve all measurements on your tenant, or a specific subset based on queries.


        In case of executing range queries) between an upper and lower boundary, for example, querying using `dateFrom`–`dateTo`, the oldest registered measurements are returned first. It is possible to change the order using the query parameter `revert=true`.


        For large measurement collections, querying older records without filters can be slow as the server needs to scan from the beginning of the input results set before beginning to return the results. For cases when older measurements should be retrieved, it is recommended to narrow the scope by using range queries based on the time stamp reported by a device. The scope of query can also be reduced significantly when a source device is provided.


        Review Measurements Specifics for details about data streaming and response formats.


        Required roles


        ROLE_MEASUREMENT_READ'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request GET "https://<TENANT_DOMAIN>/measurement/measurements" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/measurement/measurements");

          client.Timeout = -1;


          var request = new RestRequest(Method.GET);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.get(\"https://<TENANT_DOMAIN>/measurement/measurements\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"GET\", \"https://<TENANT_DOMAIN>/measurement/measurements\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/measurement/measurements\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"GET\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          $ref: '#/components/responses/measurementCollectionFound'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
    delete:
      operationId: deleteMeasurementCollectionResource
      x-codegen-resource-name: deleteMeasurements
      parameters:
      - $ref: '#/components/parameters/processingModeHeader'
      - $ref: '#/components/parameters/queryParam_measurement_dateFrom'
      - $ref: '#/components/parameters/queryParam_measurement_dateTo'
      - $ref: '#/components/parameters/queryParam_fragmentType'
      - $ref: '#/components/parameters/queryParam_measurement_source'
      - $ref: '#/components/parameters/queryParam_measurement_type'
      tags:
      - Measurements
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Remove measurement collections
      description: 'Remove measurement collections specified by query parameters.


        DELETE requests are not synchronous. The response could be returned before the delete request has been completed. This may happen especially when there are a lot of measurements to be deleted.


        > **⚠️ Important:** DELETE requires at least one of the following parameters: `source`, `dateFrom`, `dateTo`.


        In case of enhanced time series measurements, both `dateFrom` and `dateTo` parameters must be truncated to full hours (for example, 2022-08-19T14:00:00.000Z), otherwise an error will be returned.

        The `fragmentType` parameter allows to delete measurements only by a measurement fragment when enhanced time series measurements are used.

        It''s not possible to delete by a custom (non-measurement) fragment.


        Example for a valid measurement value fragment:

        ```

        "c8y_TemperatureMeasurement": {

        "T": {

        "value": 28,

        "unit": "C"

        }

        }

        ```

        In the example above `c8y_TemperatureMeasurement` is called fragment and `T` is called series.


        Example for a non-measurement fragment:

        ```

        "c8y_TemperatureMeasurement": 28

        ```

        Enhanced Time series measurements will not allow to delete by fragment specific like above.


        Required roles


        ROLE_MEASUREMENT_ADMIN'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request DELETE "https://<TENANT_DOMAIN>/measurement/measurements?source=<managedObjectId>" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/measurement/measurements?source=<managedObjectId>");

          client.Timeout = -1;


          var request = new RestRequest(Method.DELETE);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.delete(\"https://<TENANT_DOMAIN>/measurement/measurements?source=<managedObjectId>\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"DELETE\", \"https://<TENANT_DOMAIN>/measurement/measurements?source=<managedObjectId>\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/measurement/measurements?source=<managedObjectId>\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"DELETE\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '204':
          description: A collection of measurements was removed.
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '422':
          $ref: '#/components/responses/invalidPayload'
  /measurement/measurements/{id}:
    parameters:
    - $ref: '#/components/parameters/measurementId'
    get:
      operationId: getMeasurementResource
      x-codegen-resource-name: getMeasurement
      tags:
      - Measurements
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Retrieve a specific measurement
      description: 'Retrieve a specific measurement by a given ID.

        Note that you cannot retrieve time series measurements by ID.

        Instead you can search for such measurements via query parameters.

        No behavior changes for tenants which do not have time series enabled.


        Required roles


        ROLE_MEASUREMENT_READ OR owner of the source OR MEASUREMENT_READ permission on the source'
      x-code-samples:

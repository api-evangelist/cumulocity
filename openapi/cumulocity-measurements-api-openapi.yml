  /measurement/measurements/series:
    parameters:
    - $ref: '#/components/parameters/queryParam_measurement_aggregationFunction'
    - $ref: '#/components/parameters/queryParam_measurement_aggregationInterval'
    - $ref: '#/components/parameters/queryParam_measurement_aggregationType'
    - $ref: '#/components/parameters/queryParam_measurement_dateFromRequired'
    - $ref: '#/components/parameters/queryParam_measurement_dateToRequired'
    - $ref: '#/components/parameters/queryParam_measurement_revert'
    - $ref: '#/components/parameters/queryParam_measurement_series'
    - $ref: '#/components/parameters/queryParam_measurement_sourceRequired'
    get:
      operationId: getMeasurementSeriesResource
      x-codegen-resource-name: getMeasurementSeries
      tags:
      - Measurements
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Retrieve a list of series and their values
      description: 'Retrieve a list of series (all or only those matching the specified names) and their values within a given period of a specific managed object (source).


        A series is any fragment in measurement that contains a `value` property.

        When querying a series, you can retrieve aggregated data by using the aggregation parameters.

        If no aggregation is specified, the response contains a maximum of 5,000 values.


        **Aggregation Options**


        Aggregation is configured using the `aggregationInterval` parameter, which defines a custom time interval for aggregation.


        **Custom Time Intervals**


        The `aggregationInterval` value must consist of a positive integer from 1–999 range followed by a supported time unit:


        * `s` – seconds

        * `m` – minutes

        * `h` – hours

        * `d` – days

        * `w` – weeks

        * `M` – months

        * `q` – quarters

        * `y` – years


        ***Examples:*** `300s`, `25m`, `12h`, `7d`, `4w`, `3M`, `2q`, `1y`


        **Aggregation Functions**


        The `aggregationFunction` parameter specifies the functions calculated for each aggregation interval. Supported values:


        * `min`

        * `max`

        * `avg`

        * `sum`

        * `count`

        * `stdDevPop`

        * `stdDevSamp`


        If not specified, the `min` and `max` functions are calculated by default.


        To request multiple functions, repeat the parameter:


        ```markup

        aggregationFunction=min&aggregationFunction=max&aggregationFunction=avg

        ```


        The `aggregationFunction` parameter is valid only when aggregation is defined using `aggregationInterval`. Otherwise, the request returns a 400 Bad Request error.


        >**ⓘ Info:** Applies only to timeseries persistence. For legacy persistence, only min and max are always calculated and `aggregationFunction` parameter is ignored.


        > **⚠️ Important:** For correct aggregation, devices must use a consistent time zone when sending timestamps.


        Required roles


        ROLE_MEASUREMENT_READ OR owner of the source OR MEASUREMENT_READ permission on the source'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request GET "https://<TENANT_DOMAIN>/measurement/measurements/series?source=<sourceID>&dateFrom=<startDate>&dateTo=<endDate>" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/measurement/measurements/series?source=<sourceID>&dateFrom=<startDate>&dateTo=<endDate>");

          client.Timeout = -1;


          var request = new RestRequest(Method.GET);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.get(\"https://<TENANT_DOMAIN>/measurement/measurements/series?source=<sourceID>&dateFrom=<startDate>&dateTo=<endDate>\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"GET\", \"https://<TENANT_DOMAIN>/measurement/measurements/series?source=<sourceID>&dateFrom=<startDate>&dateTo=<endDate>\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/measurement/measurements/series?source=<sourceID>&dateFrom=<startDate>&dateTo=<endDate>\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"GET\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          description: The request has succeeded and the series are sent in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementSeries'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
components:
  parameters:
    processingModeHeader:
      name: X-Cumulocity-Processing-Mode
      in: header
      description: Used to explicitly control the processing mode of the request. See [Processing mode](#processing-mode) for more details.
      required: false
      schema:
        type: string
        default: PERSISTENT
        enum:
        - PERSISTENT
        - TRANSIENT
        - QUIESCENT
        - CEP
        example: PERSISTENT
    queryParam_measurement_revert:
      name: revert
      in: query
      description: "If you are using a range query (that is, at least one of the `dateFrom` or `dateTo` parameters is included in the request), then setting `revert=false` will sort the \nresults by the oldest measurements first and `revert=true` will sort the results by the newest measurements first. By default, the results are sorted by the newest \nmeasurements first for time series and by the oldest first for legacy measurements.\n"
      schema:
        type: boolean
        default: true for time series and false for legacy measurements
        example: true
    queryParam_measurement_series:
      name: series
      in: query
      description: 'The specific series to search for.

        >**&#9432; Info:** If you want to query multiple series at once, you must specify the parameter multiple times.

        '
      schema:
        type: array
        items:
          type: string
          minLength: 1
        example: c8y_Speed.speedX&series=c8y_Speed.speedY
      style: form
      explode: true
    queryParam_measurement_aggregationInterval:
      name: aggregationInterval
      in: query
      description: 'Fetch results are aggregated using a time interval specified by an integer followed by a unit.

        Available units of `s`econd, `m`inute, `h`our, `d`ay, `w`eek, `M`onth, `q`uarter and `y`ear are specified using their first letter.

        Provided integer value must be positive with maximum three digits and without leading zeros.

        >**&#9432; Info:** Full range of values for `aggregationInterval` parameter is only available when time series persistence is enabled. For legacy persistence the implementation will always fall back to `1d`, `1h` or `1m` based on the closest unit used.

        '
      schema:
        type: string
        minLength: 2
        maxLength: 4
        example:
        - 300s
        - 25m
        - 12h
        - 7d
        - 4w
        - 6M
        - 3q
        - 5y
    queryParam_withTotalElements:
      name: withTotalElements
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of elements. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalElements` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_measurement_aggregationType:
      name: aggregationType
      in: query
      description: 'Fetch aggregated results as specified.

        >**&#9432; Info:** When time series persistence is enabled, then this parameter is superseded by `aggregationInterval` and will be ignored if that parameter is specified. `aggregationType` should only be used for legacy persistence.

        '
      schema:
        type: string
        enum:
        - DAILY
        - HOURLY
        - MINUTELY
        example: MINUTELY
    queryParam_measurement_sourceRequired:
      name: source
      in: query
      description: The managed object ID to which the measurement is associated.
      required: true
      schema:
        type: string
        minLength: 1
        example: '251994'
    queryParam_measurement_dateFromRequired:
      name: dateFrom
      in: query
      description: Start date or date and time of the measurement.
      required: true
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2020-03-01'
    queryParam_measurement_dateFrom:
      name: dateFrom
      in: query
      description: Start date or date and time of the measurement.
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2020-03-01'
    queryParam_measurement_valueFragmentType:
      name: valueFragmentType
      in: query
      description: A characteristic which identifies the measurement.
      schema:
        type: string
        minLength: 1
        example: c8y_Steam
    queryParam_measurement_dateToRequired:
      name: dateTo
      in: query
      description: End date or date and time of the measurement.
      required: true
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2020-03-30'
    queryParam_withTotalPages:
      name: withTotalPages
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of pages. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalPages` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_currentPage:
      name: currentPage
      in: query
      description: The current page of the paginated results.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 3
    measurementId:
      name: id
      in: path
      description: Unique identifier of the measurement.
      required: true
      schema:
        type: string
        minLength: 1
        example: '102700509'
    queryParam_measurement_aggregationFunction:
      name: aggregationFunction
      in: query
      description: 'Selects aggregation functions that are calculated for each selected aggregation interval.

        Providing this parameter requires also providing the `aggregationInterval` parameter.

        By default `min` and `max` functions are calculated.

        >**&#9432; Info:** This parameter is only available when time series persistence is enabled. For legacy persistence only `min` and `max` are calculated. If you want to calculate multiple functions at once, you must specify the parameter multiple times.

        '
      schema:
        type: array
        items:
          type: string
        enum:
        - min
        - max
        - avg
        - sum
        - count
        - stdDevPop
        - stdDevSamp
        example: min&aggregationFunction=max&aggregationFunction=count
    queryParam_measurement_type:
      name: type
      in: query
      description: The type of measurement to search for.
      schema:
        type: string
        minLength: 1
        example: c8y_Water
    queryParam_measurement_source:
      name: source
      in: query
      description: The managed object ID to which the measurement is associated.
      schema:
        type: string
        minLength: 1
        example: '251994'
    queryParam_fragmentType:
      name: fragmentType
      in: query
      description: A characteristic which identifies a managed object or event, for example, geolocation, electricity sensor, relay state.
      schema:
        type: string
        minLength: 1
        example: c8y_IsDevice
    queryParam_measurement_dateTo:
      name: dateTo
      in: query
      description: End date or date and time of the measurement.
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2020-03-30'
    queryParam_measurement_valueFragmentSeries:
      name: valueFragmentSeries
      in: query
      description: The specific series to search for.
      schema:
        type: string
        minLength: 1
        example: Temperature
    acceptHeader:
      name: Accept
      in: header
      description: Advertises which content types, expressed as MIME types, the client is able to understand.
      required: false
      schema:
        type: string
        minLength: 1
        example: application/json
    queryParam_pageSize:
      name: pageSize
      in: query
      description: Indicates how many entries of the collection shall be returned. The upper limit for one page is 2,000 objects.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 5
        example: 10
  schemas:
    desc_self:
      title: SelfURL
      description: A URL linking to this resource.
      type: string
      format: uri
      readOnly: true
    desc_nextPage:
      title: NextPageURL
      description: A URI reference [[RFC3986](https://tools.ietf.org/html/rfc3986)] to a potential next page of managed objects.
      type: string
      readOnly: true
    MeasurementSeries:
      type: object
      properties:
        values:
          description: Each property contained here is a date taken from the measurement and it contains an array of objects specifying `min` and `max` pair of values. Each pair corresponds to a single series object in the `series` array. If there is no aggregation used, `min` is equal to `max` in every pair.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/MeasurementSeriesValue'
          example:
            '2020-12-04T17:33:01.538+01:00':
            - min: 13.37
              max: 13.37
        series:
          description: An array containing the type of series and units.
          type: array
          items:
            $ref: '#/components/schemas/measurementFragmentSeries'
          example:
          - unit: m/s2
            name: acceleration
            type: c8y_AccelerationMeasurement
        truncated:
          description: If there were more than 5000 values, the final result was truncated.
          type: boolean
          example: false
    error:
      type: object
      properties:
        error:
          description: The type of error returned.
          type: string
        message:
          description: A human-readable message providing more details about the error.
          type: string
        info:
          description: A URI reference [[RFC3986](https://tools.ietf.org/html/rfc3986)] that identifies the error code reported.
          type: string
    MeasurementCollection:
      type: object
      required:
      - measurements
      properties:
        measurements:
          description: An array containing the measurements of the request.
          type: array
          items:
            $ref: '#/components/schemas/measurement'
        next:
          $ref: '#/components/schemas/desc_nextPage'
        prev:
          $ref: '#/components/schemas/desc_prevPage'
        self:
          $ref: '#/components/schemas/desc_self'
        statistics:
          allOf:
          - readOnly: true
          - $ref: '#/components/schemas/pageStatistics'
      example:
        prev: https://<TENANT_DOMAIN>/measurement/measurements?pageSize=1&currentPage=1
        self: https://<TENANT_DOMAIN>/measurement/measurements?pageSize=1&currentPage=2
        next: https://<TENANT_DOMAIN>/measurement/measurements?pageSize=1&currentPage=3
        measurements:
        - id: '20200301'
          self: https://<TENANT_DOMAIN>/measurement/measurements/20200301
          source:
            id: '251982'
            self: https://<TENANT_DOMAIN>/inventory/managedObjects/251982
          time: '2020-03-19T12:03:27.845Z'
          type: c8y_TemperatureMeasurement
          c8y_Steam:
            Temperature:
              unit: C
              value: 100
        statistics:
          totalPages: 10
          pageSize: 1
          currentPage: 2
    pageStatistics:
      description: Information about paging statistics.
      type: object
      readOnly: true
      properties:
        currentPage:
          description: The current page of the paginated results.
          type: integer
          minimum: 1
          example: 2
        pageSize:
          description: Indicates the number of objects that the collection may contain per page. The upper limit for one page is 2,000 objects.
          type: integer
          minimum: 1
          maximum: 2000
          example: 5
        totalElements:
          description: The total number of results (elements).
          type: integer
          minimum: 0
          example: 12
        totalPages:
          description: 'The total number of paginated results (pages).


            > **&#9432; Info:** This property is returned by default except when an operation retrieves all records where values are between an upper and lower boundary, for example, querying ranges using `dateFrom`–`dateTo`. In such cases, the query parameter `withTotalPages=true` should be used to include the total number of pages (at the expense of slightly slower performance).

            '
          type: integer
          minimum: 0
          example: 3
    measurementFragmentSeries:
      type: object
      properties:
        unit:
          description: The unit of the measurement.
          type: string
        name:
          description: The name of the measurement.
          type: string
        type:
          description: The type of measurement.
          type: string
    desc_objectId:
      title: ObjectId
      description: Unique identifier of the object.
      type: string
      minLength: 1
    c8y_Steam:
      description: A type of measurement fragment.
      type: object
      properties:
        Temperature:
          type: object
          required:
          - value
          properties:
            unit:
              description: The unit of the measurement.
              type: string
              minLength: 1
              example: C
            value:
              description: The value of the individual measurement.
              type: number
              example: 100
    measurement:
      type: object
      required:
      - source
      - type
      - time
      properties:
        id:
          description: Unique identifier of the measurement.
          type: string
          readOnly: true
        self:
          $ref: '#/components/schemas/desc_self'
        source:
          description: The managed object to which the measurement is associated.
          type: object
          required:
          - id
          properties:
            id:
              $ref: '#/components/schemas/desc_objectId'
            self:
              $ref: '#/components/schemas/desc_self'
        time:
          description: The date and time when the measurement is created.
          type: string
          format: date-time
        type:
          description: Identifies the type of this measurement.
          type: string
        c8y_Steam:
          $ref: '#/components/schemas/c8y_Steam'
      additionalProperties:
        description: 'It is possible to add an arbitrary number of additional properties as a list of key-value pairs, for example, `"property1": {}`, `"property2": "value"`. These properties are known as custom fragments and can be of any type, for example, object or string. Each custom fragment is identified by a unique name.


          Review [Getting started > Technical concepts > Cumulocity''s domain model > Inventory > Fragments > Naming conventions of fragments](https://www.cumulocity.com/docs/concepts/domain-model/#naming-conventions-of-fragments) in the Cumulocity user documentation as there are characters that can not be used when naming custom fragments.

          '
        x-additionalPropertiesName: customFragments
      example:
        id: '20200301'
        self: https://<TENANT_DOMAIN>/measurement/measurements/20200301
        source:
          id: '251982'
          self: https://<TENANT_DOMAIN>/inventory/managedObjects/251982
        time: '2020-03-19T12:03:27.845Z'
        type: c8y_TemperatureMeasurement
        c8y_Steam:
          Temperature:
            unit: C
            value: 100
    desc_prevPage:
      title: PreviousPageURL
      description: A URI reference [[RFC3986](https://tools.ietf.org/html/rfc3986)] to a potential previous page of managed objects.
      type: string
      readOnly: true
    MeasurementSeriesValue:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
    bulkRequestError:
      allOf:
      - $ref: '#/components/schemas/error'
      - type: object
        properties:
          bulkRequest:
            description: 'Present when the error belongs to one element of the bulk request.

              Absent when the error belongs to the whole request, for example, when the request has too many elements or none.

              '
            type: object
            required:
            - failedIndex
            properties:
              failedIndex:
                description: 'The position of the element that the error belongs to, counted from 0 in the request.

                  If several elements are invalid, the lowest position is reported.

                  '
                type: integer
                minimum: 0
                example: 17
              fragmentType:
                description: 'The batch marker fragment carried by the managed objects that the request created.

                  Present only when part of the bulk create may have been created.

                  Use it as the `fragmentType` query parameter to find the created managed objects.

                  '
                type: string
                example: c8y_BatchId_7c8e1e0a-3b2f-4f6e-9a51-5d2c7e4b9f10
  responses:
    measurementFound:
      description: The request has succeeded and the measurement is sent in the response.
      content:
        application/vnd.com.nsn.cumulocity.measurement+json:
          schema:
            $ref: '#/components/schemas/measurement'
    invalidPayload:
      description: Unprocessable Entity – invalid payload.
    measurementCollectionFound:
      description: The request has succeeded and all measurements are sent in the response.
      content:
        application/vnd.com.nsn.cumulocity.measurementcollection+json:
          schema:
            $ref: '#/components/schemas/MeasurementCollection'
    measurementNotFound:
      description: Measurement not found.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: measurement/Not Found
            message: Finding measurement from database failed
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
    unauthorizedError:
      description: Authentication information is missing or invalid.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: security/Unauthorized
            message: 'Invalid credentials! : Bad credentials'
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
    operationNotAuthorized:
      description: Not authorized to perform this operation.
    invalidBulkPayload:
      description: Unprocessable Entity – invalid payload.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/bulkRequestError'
          example:
            error: undefined/validationError
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
            bulkRequest:
              failedIndex: 2
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: 'The authorization header is formed as `Basic <Base64(<tenantID>/<c8yuser>:<password>)>`. For instance, if your tenantID, username and password are **t0071234**, **testuser** and **secret123** respectively, you can generate the Base64 string with the following command:


        ```shell

        $ echo -n t0071234/testuser:secret123 | base64

        ```


        and your authorization header would look like this:


        ```

        "Authorization": "Basic dDAwNzEyMzQvdGVzdHVzZXI6c2VjcmV0MTIz"

        ```

        '
    OAI-Secure:
      type: http
      scheme: bearer
      description: 'This is the recommended authorization method because it provides high security using authorization tokens to prove the identity of the user, and it is the default login mode on creating new tenants. This mode is an enhancement of the previous OAuth Internal authentication (available prior to 10.13.0).


        For more details about OAI-Secure authentication, see [Platform administration > Authentication > Basic settings > Login settings](https://www.cumulocity.com/docs/authentication/basic-settings/#login-settings) in the Cumulocity user documentation.

        '
    SSO:
      type: oauth2
      description: "The login with SSO requires a correct configuration on the [Cumulocity side](https://www.cumulocity.com/docs/authentication/sso/). With the configuration, an additional button is available on the Login page. After clicking the button, the user is redirected to authenticate with the configured authorization server. On successful login, the user is redirected to Cumulocity.\n\nAuthentication details are exchanged using cookies. There are two parts to it, the first is the authentication cookie that is handled automatically by the Cumulocity platform. The second is the XSRF-TOKEN cookie. When a client receives the cookie, it should take the value and put it in the X-XSRF-TOKEN request header in all subsequent requests.\n\nThe flow of authenticating with authentication code grant is as follows:\n\n![Authentication flow](images/oauth-simple-flow.png)\n\nThe first request executed by the browser is:\n\n```http\nGET /tenant/loginOptions\nHost: https://<TENANT_DOMAIN>\nAccept: application/vnd.com.nsn.cumulocity.loginoptioncollection+json\n```\n\nResponse sample:\n\n```json\n{\n    \"loginOptions\": [\n        {\n            \"buttonName\": \"Login with oauth\",\n            \"grantType\": \"<AUTHORIZATION_CODE>\",\n            \"initRequest\": \"https://<TENANT_DOMAIN>/tenant/oauth?response_type=code&tenant_id=<TENANT_ID>\",\n            \"self\": \"https://<TENANT_DOMAIN>/tenant/loginOptions/oauth2\",\n            \"type\": \"oauth2\"\n        },\n        ...\n    ],\n    \"self\": \"http://<TENANT_DOMAIN>/tenant/loginOptions/\"\n}\n```\n\nThe browser must invoke the request provided in the initRequest parameter.\n\nThe initRequest initiates the redirect, in which the user is prompted for credentials. After successful login, the user is redirected back to the browser, where it must capture the code request parameter. Then the request to exchange the code for the token is as follows:\n\n```http\nPOST /tenant/oauth?grant_type=authorization_code&code=<CODE>\nHost: https://<TENANT_DOMAIN>\n```\n\nA successful response will have no body but the following response headers:\n\n```\nSet-Cookie: authorization=<TOKEN>;\nSet-Cookie: XSRF-TOKEN=<XSRF-TOKEN>;\n```\n\nThe authorization cookie is valid for two weeks.\n"
      flows:
        clientCredentials:
          tokenUrl: /tenant/oauth?grant_type=authorization_code&code=<CODE>
          scopes: {}
    JWT-IAM:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'This kind of authentication substitutes the JWT authentication with OAuth2 access tokens from your Identity and Access Management (IAM).

        You can enable this in the [SSO configuration](https://www.cumulocity.com/docs/authentication/sso/).


        The HTTP header must include:


        ```

        "Authorization": "Bearer <Access token>"

        ```


        When a request with a bearer token in the header is received, Cumulocity checks if the access token is from your IAM (that is, if authentication is enabled in your SSO configuration), and verifies the authenticity of

        the token remotely against the IAM.

        '

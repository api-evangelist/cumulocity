    put:
      operationId: putAlarmResource
      x-codegen-resource-name: updateAlarm
      parameters:
      - $ref: '#/components/parameters/acceptHeader'
      - $ref: '#/components/parameters/processingModeHeader'
      tags:
      - Alarms
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      - JWT-IAM: []
      summary: Update a specific alarm
      description: 'Update a specific alarm by a given ID.

        Only text, status, severity and custom properties can be modified. A request will be rejected when non-modifiable properties are provided in the request body.


        > **ⓘ Info:** Changes to alarms will generate a new audit record. The audit record will include the username and application that triggered the update, if applicable. If the update operation doesn’t change anything (that is, the request body contains data that is identical to the already present in the database), there will be no audit record added and no notifications will be sent.


        Required roles


        ROLE_ALARM_ADMIN OR owner of the source OR ALARM_ADMIN permission on the source'
      requestBody:
        required: true
        content:
          application/vnd.com.nsn.cumulocity.alarm+json:
            example:
              severity: MAJOR
              status: ACTIVE
              text: No data received from the device within the required interval.
            schema:
              allOf:
              - $ref: '#/components/schemas/alarm'
              - properties:
                  source:
                    readOnly: true
                  time:
                    readOnly: true
                  type:
                    readOnly: true
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request PUT "https://<TENANT_DOMAIN>/alarm/alarms/{id}" \

          --header "Authorization: Basic <AUTHORIZATION>" \

          --header "Accept: application/json" \

          --header "Content-Type: application/json" \

          --data-raw ''<Payload>''

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/alarm/alarms/{id}");

          client.Timeout = -1;


          var request = new RestRequest(Method.PUT);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");

          request.AddHeader("Content-Type", "application/json");

          request.AddHeader("Accept", "application/json");

          request.AddParameter("application/json", "<Payload>",  ParameterType.RequestBody);


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java

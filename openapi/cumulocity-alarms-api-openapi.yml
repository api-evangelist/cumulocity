components:
  parameters:
    queryParam_alarm_withSourceChildren:
      name: withSourceChildren
      in: query
      description: When set to `true`, alarms for related source assets, devices and additions will also be included in the response. When this parameter is provided a `source` must be specified.
      schema:
        type: boolean
        default: false
        example: true
    processingModeHeader:
      name: X-Cumulocity-Processing-Mode
      in: header
      description: Used to explicitly control the processing mode of the request. See [Processing mode](#processing-mode) for more details.
      required: false
      schema:
        type: string
        default: PERSISTENT
        enum:
        - PERSISTENT
        - TRANSIENT
        - QUIESCENT
        - CEP
        example: PERSISTENT
    queryParam_alarm_dateFrom:
      name: dateFrom
      in: query
      description: Start date or date and time of the alarm occurrence.
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2020-03-01'
    queryParam_withTotalElements:
      name: withTotalElements
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of elements. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalElements` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_alarm_withSourceAssets:
      name: withSourceAssets
      in: query
      description: When set to `true`, alarms for related source assets will also be included in the response. When this parameter is provided a `source` must be specified.
      schema:
        type: boolean
        default: false
        example: true
    queryParam_alarm_dateTo:
      name: dateTo
      in: query
      description: End date or date and time of the alarm occurrence.
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2020-03-30'
    queryParam_alarm_resolved:
      name: resolved
      in: query
      description: When set to `true` only alarms with status CLEARED will be fetched, whereas `false` will fetch all alarms with status ACTIVE or ACKNOWLEDGED. Takes precedence over the `status` parameter.
      schema:
        type: boolean
        default: false
        example: true
    queryParam_alarm_withSourceAdditions:
      name: withSourceAdditions
      in: query
      description: When set to `true`, alarms for related source additions will also be included in the response. When this parameter is provided a `source` must be specified.
      schema:
        type: boolean
        default: false
        example: true
    queryParam_alarm_withSourceDevices:
      name: withSourceDevices
      in: query
      description: When set to `true`, alarms for related source devices will also be included in the response. When this parameter is provided a `source` must be specified.
      schema:
        type: boolean
        default: false
        example: true
    queryParam_withTotalPages:
      name: withTotalPages
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of pages. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalPages` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_lastUpdatedTo:
      name: lastUpdatedTo
      in: query
      description: End date or date and time of the last update made.
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2020-03-30'
    queryParam_alarm_createdFrom:
      name: createdFrom
      in: query
      description: Start date or date and time of the alarm creation.
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2021-03-01'
    queryParam_currentPage:
      name: currentPage
      in: query
      description: The current page of the paginated results.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 3
    queryParam_alarm_source:
      name: source
      in: query
      description: The managed object ID to which the alarm is associated.
      schema:
        type: string
        minLength: 1
        example: '251994'
    queryParam_alarm_severity:
      name: severity
      in: query
      description: 'The severity of the alarm to search for.

        >**&#9432; Info:** If you query for multiple alarm severities at once, comma-separate the values.

        '
      schema:
        type: array
        items:
          type: string
          minLength: 1
        enum:
        - CRITICAL
        - MAJOR
        - MINOR
        - WARNING
        example:
        - CRITICAL
        - MAJOR
      explode: false
    queryParam_lastUpdatedFrom:
      name: lastUpdatedFrom
      in: query
      description: Start date or date and time of the last update made.
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2020-03-01'
    alarmId:
      name: id
      in: path
      description: Unique identifier of the alarm.
      required: true
      schema:
        type: string
        minLength: 1
        example: '20200301'
    queryParam_alarm_incrementCount:
      name: incrementCount
      in: query
      description: When set to `true`, the `count` property of an existing alarm is incremented during upsert.
      schema:
        type: boolean
        default: false
        example: true
    acceptHeader:
      name: Accept
      in: header
      description: Advertises which content types, expressed as MIME types, the client is able to understand.
      required: false
      schema:
        type: string
        minLength: 1
        example: application/json
    queryParam_alarm_status:
      name: status
      in: query
      description: 'The status of the alarm to search for. Should not be used when `resolved` parameter is provided.

        >**&#9432; Info:** If you query for multiple alarm statuses at once, comma-separate the values.

        '
      schema:
        type: array
        items:
          type: string
          minLength: 1
        enum:
        - ACTIVE
        - ACKNOWLEDGED
        - CLEARED
        example:
        - ACTIVE
        - ACKNOWLEDGED
      explode: false
    queryParam_alarm_type:
      name: type
      in: query
      description: 'The types of alarm to search for.

        >**&#9432; Info:** If you query for multiple alarm types at once, comma-separate the values. Space characters in alarm types must be escaped.

        '
      schema:
        type: array
        items:
          type: string
          minLength: 1
        example:
        - c8y_UnavailabilityAlarm
        - c8y_TemperatureAlarm
      explode: false
    queryParam_pageSize:
      name: pageSize
      in: query
      description: Indicates how many entries of the collection shall be returned. The upper limit for one page is 2,000 objects.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 5
        example: 10
    queryParam_alarm_createdTo:
      name: createdTo
      in: query
      description: End date or date and time of the alarm creation.
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2021-03-30'

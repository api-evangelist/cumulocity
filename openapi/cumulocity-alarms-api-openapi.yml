      - $ref: '#/components/parameters/queryParam_alarm_withSourceAssets'
      - $ref: '#/components/parameters/queryParam_alarm_withSourceDevices'
      - $ref: '#/components/parameters/queryParam_alarm_withSourceAdditions'
      - $ref: '#/components/parameters/queryParam_withTotalElements'
      - $ref: '#/components/parameters/queryParam_withTotalPages'
      tags:
      - Alarms
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      - JWT-IAM: []
      summary: Retrieve all alarms
      description: 'Retrieve all alarms on your tenant, or a specific subset based on queries. The results are sorted by the newest alarms first.


        #### Query parameters


        The query parameter `withTotalPages` only works when the user has the ROLE_ALARM_READ role, otherwise it is ignored.


        Required roles


        The role ROLE_ALARM_READ is not required, but if a user has this role, all the alarms on the tenant are returned. If a user has access to alarms through inventory roles, only those alarms are returned.'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request GET "https://<TENANT_DOMAIN>/alarm/alarms" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/alarm/alarms");

          client.Timeout = -1;


          var request = new RestRequest(Method.GET);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.get(\"https://<TENANT_DOMAIN>/alarm/alarms\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"GET\", \"https://<TENANT_DOMAIN>/alarm/alarms\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/alarm/alarms\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"GET\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          $ref: '#/components/responses/alarmCollectionFound'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
    put:
      operationId: putAlarmCollectionResource
      x-codegen-resource-name: updateAlarms
      parameters:
      - $ref: '#/components/parameters/acceptHeader'
      - $ref: '#/components/parameters/processingModeHeader'
      - $ref: '#/components/parameters/queryParam_alarm_createdFrom'
      - $ref: '#/components/parameters/queryParam_alarm_createdTo'
      - $ref: '#/components/parameters/queryParam_alarm_dateFrom'
      - $ref: '#/components/parameters/queryParam_alarm_dateTo'
      - $ref: '#/components/parameters/queryParam_alarm_resolved'
      - $ref: '#/components/parameters/queryParam_alarm_severity'
      - $ref: '#/components/parameters/queryParam_alarm_source'
      - $ref: '#/components/parameters/queryParam_alarm_status'
      - $ref: '#/components/parameters/queryParam_alarm_withSourceChildren'
      - $ref: '#/components/parameters/queryParam_alarm_withSourceAssets'
      - $ref: '#/components/parameters/queryParam_alarm_withSourceDevices'
      - $ref: '#/components/parameters/queryParam_alarm_withSourceAdditions'
      tags:
      - Alarms
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      - JWT-IAM: []
      summary: Update alarm collections
      description: 'Update alarm collections specified by query parameters. At least one query parameter is required to avoid accidentally updating all existing alarms.


        Currently, only the status of alarms can be modified.


        > **ⓘ Info:** Since this operation can take considerable time, the request returns after maximum 0.5 seconds of processing, and the update operation continues as a background process in the platform.


        Required roles


        ROLE_ALARM_ADMIN'
      requestBody:
        required: true
        content:
          application/vnd.com.nsn.cumulocity.alarm+json:
            example:
              status: CLEARED
            schema:
              allOf:
              - $ref: '#/components/schemas/alarm'
              - properties:
                  severity:
                    readOnly: true
                  source:
                    readOnly: true
                  text:
                    readOnly: true
                  time:
                    readOnly: true
                  type:
                    readOnly: true
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request PUT "https://<TENANT_DOMAIN>/alarm/alarms?resolved=false&source=<managedObjectId>" \

          --header "Authorization: Basic <AUTHORIZATION>" \

          --header "Accept: application/json" \

          --header "Content-Type: application/json" \

          --data-raw ''<Payload>''

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/alarm/alarms?resolved=false&source=<managedObjectId>");

          client.Timeout = -1;


          var request = new RestRequest(Method.PUT);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");

          request.AddHeader("Content-Type", "application/json");

          request.AddHeader("Accept", "application/json");

          request.AddParameter("application/json", "<Payload>",  ParameterType.RequestBody);


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.put(\"https://<TENANT_DOMAIN>/alarm/alarms?resolved=false&source=<managedObjectId>\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .header(\"Content-Type\", \"application/json\")\n    .header(\"Accept\", \"application/json\")\n    .body(\"<Payload>\")\n    .asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"PUT\", \"https://<TENANT_DOMAIN>/alarm/alarms?resolved=false&source=<managedObjectId>\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\",\n        \"Accept\": \"application/json\",\n        \"Content-Type\": \"application/json\"\n    })\n    .send(JSON.stringify( <Payload> ))\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\nimport json\n\nurl = \"https://<TENANT_DOMAIN>/alarm/alarms?resolved=false&source=<managedObjectId>\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\",\n  \"Accept\": \"application/json\",\n  \"Content-Type\": \"application/json\"\n}\nresponse = requests.request(\"PUT\", url, headers=headers, json.dumps(<Payload>))\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          description: An alarm collection was updated.
        '202':
          description: An alarm collection is being updated in background.
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '422':
          $ref: '#/components/responses/invalidPayload'

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/alarm/alarms?resolved=true&source=<managedObjectId>");

          client.Timeout = -1;


          var request = new RestRequest(Method.DELETE);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");



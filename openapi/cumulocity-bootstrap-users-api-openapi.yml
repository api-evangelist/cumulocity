openapi: 3.2.0
info:
  title: Cumulocity Application Bootstrap Users API
  version: 10.20.0
  description: 'Register, subscribe, configure, and upload Cumulocity microservices, hosted web applications, and plugins.

    Microservices run inside Cumulocity''s managed container runtime and authenticate via a bootstrap user

    issued by this API; web applications are uploaded as ZIPs and served from the tenant subdomain.

    '
servers:
- url: https://{tenant}.cumulocity.com
  variables:
    tenant:
      default: example
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Bootstrap Users
paths:
  /application/applications/{id}/bootstrapUser:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Bootstrap Users
      summary: Retrieve the Bootstrap User of a Microservice Application
      operationId: getBootstrapUser
      responses:
        '200':
          description: Bootstrap user credentials.
          content:
            application/vnd.com.nsn.cumulocity.bootstrapUser+json:
              schema:
                $ref: '#/components/schemas/BootstrapUser'
components:
  schemas:
    BootstrapUser:
      type: object
      properties:
        tenant:
          type: string
        name:
          type: string
        password:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

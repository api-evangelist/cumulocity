  /tenant/statistics/files:
    post:
      operationId: postGenerateStatisticsFileRequest
      x-codegen-resource-name: generateStatisticsFile
      parameters:
      - $ref: '#/components/parameters/acceptHeader'
      tags:
      - Usage statistics
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Generate a statistics file report
      description: 'Generate a TEST statistics file report for a given time range.


        There are two types of statistics files:

        * REAL - generated by the system on the first day of the month and including statistics from the previous month.

        * TEST - generated by the user with a time range specified in the query parameters (`dateFrom`, `dateTo`).


        `dateFrom` and `dateTo` are using daily granularity and each day is stored with respect to local Time Zone of the server.


        > **ⓘ Info:** This is only accessible by the Management tenant.


        Required roles


        ROLE_TENANT_MANAGEMENT_ADMIN OR ROLE_TENANT_MANAGEMENT_CREATE'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request POST "https://<TENANT_DOMAIN>/tenant/statistics/files" \

          --header "Authorization: Basic <AUTHORIZATION>" \

          --header "Accept: application/json" \

          --header "Content-Type: application/json" \

          --data-raw "<Payload>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/tenant/statistics/files");

          client.Timeout = -1;


          var request = new RestRequest(Method.POST);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");

          request.AddHeader("Content-Type", "application/json");

          request.AddHeader("Accept", "application/json");

          request.AddParameter("application/json", "<Payload>",  ParameterType.RequestBody);


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.post(\"https://<TENANT_DOMAIN>/tenant/statistics/files\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .header(\"Content-Type\", \"application/json\")\n    .header(\"Accept\", \"application/json\")\n    .body(\"<Payload>\")\n    .asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"POST\", \"https://<TENANT_DOMAIN>/tenant/statistics/files\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\",\n        \"Accept\": \"application/json\",\n        \"Content-Type\": \"application/json\"\n    })\n    .send(JSON.stringify( <Payload> ))\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/tenant/statistics/files\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\",\n  \"Accept\": \"application/json\",\n  \"Content-Type\": \"application/json\"\n}\nresponse = requests.request(\"POST\", url, headers=headers, data = json.dumps(<Payload>))\nprint(response.text.encode(\"utf8\"))\n"
      requestBody:
        required: true
        content:
          application/vnd.com.nsn.cumulocity.tenantstatisticsdate+json:
            schema:
              $ref: '#/components/schemas/rangeStatisticsFile'
      responses:
        '201':
          description: A statistics file was generated.
          content:
            application/vnd.com.nsn.cumulocity.tenantstatisticsfile+json:
              schema:
                $ref: '#/components/schemas/StatisticsFile'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '422':
          $ref: '#/components/responses/invalidPayload'
    get:
      operationId: getTenantUsageStatisticsFileCollectionResource
      x-codegen-resource-name: getMetadata
      parameters:
      - $ref: '#/components/parameters/queryParam_currentPage'
      - $ref: '#/components/parameters/queryParam_file_dateFrom'
      - $ref: '#/components/parameters/queryParam_file_dateTo'
      - $ref: '#/components/parameters/queryParam_pageSize'
      - $ref: '#/components/parameters/queryParam_withTotalPages'
      tags:
      - Usage statistics
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Retrieve usage statistics files metadata
      description: 'Retrieve usage statistics summary files report metadata.


        > **ⓘ Info:** This is only accessible by the Management tenant.


        Date range defines the search criteria for files which have any data inside this range. For example, query containing `dateFrom=2023-03-01&dateTo=2023-03-31`

        will return files with statistics from ranges 2023-02-25---2023-03-03, 2023-03-04---2023-03-05, 2023-03-15---2023-04-15, but not the files where

        the whole range of data is outside of queried range, like 2023-02-01---2023-02-27.


        Required roles


        ROLE_TENANT_MANAGEMENT_ADMIN'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request GET "https://<TENANT_DOMAIN>/tenant/statistics/files" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/tenant/statistics/files");

          client.Timeout = -1;


          var request = new RestRequest(Method.GET);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.get(\"https://<TENANT_DOMAIN>/tenant/statistics/files\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"GET\", \"https://<TENANT_DOMAIN>/tenant/statistics/files\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/tenant/statistics/files\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"GET\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          $ref: '#/components/responses/tenantStatisticsFileCollectionFound'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'

tags:
- name: Usage statistics
  description: 'Days are counted according to server timezone, so be aware that the tenant usage statistics displaying/filtering may not work correctly when the client is not in the same timezone as the server. However, it is possible to send a request with a time range (using the query parameters `dateFrom` and `dateTo`) in zoned format (for example, `2020-10-26T03:00:00%2B01:00`). Statistics from past days are stored with daily aggregations, which means that for a specific day you get either the statistics for the whole day or none at all. ### Request counting in SmartREST and MQTT


    * SmartREST: Each row in a SmartREST request is transformed into a separate HTTP request. For example, if one SmartREST request contains 10 rows, then 10 separate calls are executed, meaning that request count is increased by 10. * MQTT: Each row/line counts as a separate request. Creating custom template counts as a single request. ### REST specific counting details


    * All counters increase also when the request is invalid, for example, wrong payload or missing permissions. * Bulk measurements creation and bulk alarm status update are counted as a single "requestCount"/"deviceRequestCount" and multiple inbound data transfer count. ### SmartREST 1.0 specific counting details


    * Invalid SmartREST requests are not counted, for example, when the template doesn''t exist. * A new template registration is treated as two separate requests. Create a new inventory object which increases "requestCount", "deviceRequestCount" and "inventoriesCreatedCount". There is also a second request which binds the template with X-ID, this increases "requestCount" and "deviceRequestCount". * Each row in a SmartREST request is transformed into a separate HTTP request. For example, if one SmartREST request contains 10 rows, then 10 separate calls are executed, meaning that both "requestCount" and "deviceRequestCount" are increased by 10. ### MQTT specific counting details


    * Invalid requests are counted, for example, when sending a message with a wrong template ID. * Device creation request and automatic device creation are counted. * Each row/line counts as a separate request. * Creating a custom template counts as a single request, no matter how many rows are sent in the request. * There is one special SmartREST 2.0 template (402 Create location update event with device update) which is doing two things in one call, that is, create a new location event and update the location of the device. It is counted as two separate requests. ### JSON via MQTT specific counting details


    * Invalid requests are counted, for example, when the message payload is invalid. * Bulk creation requests are counted as a single "requestCount"/"deviceRequestCount" and multiple inbound data transfer count. * Bulk creation requests with a wrong payload are not counted for inbound data transfer count. ### Notifications 2.0 specific counting details


    * Invalid requests are counted, for example, unsuccessful subscription. * All Notifications 2.0 subscription API requests are counted. * All Notifications 2.0 token API requests are counted. * Notifications 2.0 WebSocket consumer connection requests are not counted. * Messages delivered over Notifications 2.0 WebSocket connections are not counted. ### Total inbound data transfer


    Inbound data transfer refers to the total number of inbound requests performed to transfer data into the Cumulocity platform. This includes sensor readings, alarms, events, commands and alike that are transferred between devices and the Cumulocity platform using the REST and/or MQTT interfaces. Such an inbound request could also originate from a custom microservice, website or any other client. See the table below for more information on how the counters are increased.'
paths:
  /tenant/statistics:
    get:
      operationId: getTenantUsageStatisticsCollectionResource
      parameters:
      - $ref: '#/components/parameters/queryParam_currentPage'
      - $ref: '#/components/parameters/queryParam_tenant_dateFrom'
      - $ref: '#/components/parameters/queryParam_tenant_dateTo'
      - $ref: '#/components/parameters/queryParam_pageSize'
      - $ref: '#/components/parameters/queryParam_withTotalElements'
      - $ref: '#/components/parameters/queryParam_withTotalPages'
      tags:
      - Usage statistics
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Retrieve statistics of the current tenant
      description: 'Retrieve usage statistics of the current tenant.


        Required roles


        ROLE_TENANT_STATISTICS_READ'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request GET "https://<TENANT_DOMAIN>/tenant/statistics" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/tenant/statistics");

          client.Timeout = -1;


          var request = new RestRequest(Method.GET);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.get(\"https://<TENANT_DOMAIN>/tenant/statistics\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"GET\", \"https://<TENANT_DOMAIN>/tenant/statistics\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/tenant/statistics\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"GET\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          $ref: '#/components/responses/tenantUsageStatisticsCollectionFound'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'

openapi: 3.2.0
info:
  title: Cumulocity DataHub Queries API
  version: 2025.1
  description: 'Offload operational IoT data (measurements, events, alarms, inventory) from the Cumulocity MongoDB

    operational store into a Parquet-backed data lake queryable with ANSI SQL via Dremio. Configure offload

    pipelines, run analytics queries, and export results to BI tools (Power BI, Tableau) over JDBC/ODBC/Arrow Flight.

    '
servers:
- url: https://{tenant}.cumulocity.com
  variables:
    tenant:
      default: example
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Queries
paths:
  /service/datahub/query:
    post:
      tags:
      - Queries
      summary: Run an Ad-Hoc SQL Query
      operationId: runQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sql:
                  type: string
      responses:
        '200':
          description: Query results.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

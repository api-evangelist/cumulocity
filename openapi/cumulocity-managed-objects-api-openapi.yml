    delete:
      operationId: deleteManagedObjectResource
      x-codegen-resource-name: deleteManagedObject
      parameters:
      - $ref: '#/components/parameters/processingModeHeader'
      - $ref: '#/components/parameters/queryParam_inventory_cascade'
      - $ref: '#/components/parameters/queryParam_inventory_forceCascade'
      - $ref: '#/components/parameters/queryParam_inventory_withDeviceUser'
      tags:
      - Managed objects
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Remove a specific managed object
      description: 'Remove a specific managed object (for example, device) by a given ID.


        > **ⓘ Info:** The platform first deletes the associated data and then the requested managed object. If this completes within 30 seconds, the response is 204 and the managed object has been deleted. Otherwise, the response is 202 and the deletion continues in the background. This happens especially when the deleted managed object has a lot of associated data or children. An error during the background deletion is not reported to the client. To verify that the managed object has been deleted, retrieve it until the response is 404.


        > **ⓘ Info:** By default, the delete operation is propagated to subgroups, but only if the object being deleted is a group. Deleting a parent group will also delete its subgroups. The cascade parameter controls whether the devices assigned to the groups are also deleted. When set to false, the devices remain intact even as the groups and subgroups are deleted. When set to true, all groups, subgroups, and their assigned devices are deleted.


        Required roles


        ROLE_INVENTORY_ADMIN OR ROLE_MANAGED_OBJECT_ADMIN OR owner of the source OR MANAGE_OBJECT_ADMIN permission on the source'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request DELETE "https://<TENANT_DOMAIN>/inventory/managedObjects/{id}" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/inventory/managedObjects/{id}");

          client.Timeout = -1;


          var request = new RestRequest(Method.DELETE);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.delete(\"https://<TENANT_DOMAIN>/inventory/managedObjects/{id}\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"DELETE\", \"https://<TENANT_DOMAIN>/inventory/managedObjects/{id}\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/inventory/managedObjects/{id}\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"DELETE\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '202':
          description: The deletion did not complete within 30 seconds and continues in the background.
          content:
            application/vnd.com.nsn.cumulocity.managedobject+json:
              schema:
                $ref: '#/components/schemas/inventoryObjectDeleteInBackground'
            application/json:
              schema:
                $ref: '#/components/schemas/inventoryObjectDeleteInBackground'
        '204':
          description: A managed object was removed.
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '404':
          $ref: '#/components/responses/inventoryObjectNotFound'
        '409':
          $ref: '#/components/responses/inventoryObjectDeleteConflict'
        '422':
          $ref: '#/components/responses/inventoryObjectDeleteInvalidData'
        '429':
          $ref: '#/components/responses/inventoryObjectDeleteTooManyRequests'

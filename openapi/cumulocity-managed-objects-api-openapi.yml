openapi: 3.2.0
info:
  version: Latest
  title: Cumulocity Managed objects API
  x-logo:
    url: https://www.cumulocity.com/docs/images/logo-platform.svg
    backgroundColor: '#F8F8F8'
    altText: Cumulocity
    href: https://www.cumulocity.com/api
  description: '# REST implementation


    This section describes the aspects common to all REST-based interfaces of Cumulocity. The interfaces are based on the Hypertext Transfer Protocol 1.1 using HTTPS. ## HTTP usage


    ### Application management


    Cumulocity uses a so-called "application key" to distinguish requests coming from devices and traffic from applications. If you write an application, pass the following header as part of all requests:


    ```markup

    X-Cumulocity-Application-Key:

    ```


    For example, if you registered your application in the Cumulocity Administration application with the key "myapp", your requests should contain the header:


    ```markup

    X-Cumulocity-Application-Key: myapp

    ```


    This makes your application subscribable and billable. If you implement a device, do not pass the key. > **ⓘ Info:** Make sure that you pass the key in **all** requests coming from an application. If you leave out the key,

    > the request will be considered as a device request, and the corresponding device will be marked as "available". ### Limited HTTP clients


    If you use an HTTP client that can only perform GET and POST methods in HTTP, you can emulate the other methods through an additional "X-HTTP-METHOD" header. Simply issue a POST request and add the header, specifying the actual REST method to be executed. For example, to emulate the "PUT" (modify) method, you can use:


    ```http

    POST ... X-HTTP-METHOD: PUT

    ```


    ### Processing mode


    Every update request (PUT, POST, DELETE) executes with a so-called *processing mode*. The processing modes are as follows:


    |Processing mode|Description|

    |---|---|

    |PERSISTENT (default)|Stores data in the Cumulocity database and sends data to the Streaming Analytics engine. Afterwards, Cumulocity returns the result of the request. This is the default mode.|

    |TRANSIENT|Sends data to the Streaming Analytics engine and immediately returns the results asynchronously but does not store data in Cumulocity’s database. This mode saves storage and processing costs and is useful for example when tracking devices in real time without requiring data to be stored.|

    |QUIESCENT|Behaves similar to the persistent mode with the exception that no real-time notifications will be sent.|

    |CEP|Behaves like the transient mode with the exception that no real-time notifications are sent.|


    To explicitly control the processing mode of an update request, you can use the "X-Cumulocity-Processing-Mode" header with a value of either "PERSISTENT", "TRANSIENT", "QUIESCENT" or "CEP":


    ```markup

    X-Cumulocity-Processing-Mode: PERSISTENT

    ```


    > **ⓘ Info:** Events are always delivered to CEP/Apama for all processing modes. This is independent from real-time notifications. ### Authorization


    All requests issued to Cumulocity are subject to authorization. To determine the required permissions, see the "Required role" entries for the individual requests. To learn more about the different permissions and the concept of ownership in Cumulocity, see Getting started > Technical concepts > Security aspects > Access control > Managing roles and assigning permissions in the Cumulocity user documentation. > **⚠️ Important:** In the Cumulocity API, each granular permission is identified by a unique “permission” string, which is prefixed with ROLE_ (for example, ROLE_ALARM_READ, ROLE_INVENTORY_ADMIN). Therefore, permissions are frequently referred to as “roles” throughout the API as well as in the configuration files. For example, the microservice manifest includes a requiredRoles field, which actually expects a permission string. See also the Glossary of the Cumulocity user documentation for the usage of the terms “permission” and “role” in the Cumulocity context. ### Media types


    Each type of data is associated with an own media type. The general format of media types is:


    ```markup

    application/vnd.com.nsn.cumulocity.+json;ver=;charset=UTF-8

    ```


    Each media type contains a parameter `ver` indicating the version of the type.'
servers:
- description: Cumulocity tenant
  url: https://<TENANT_DOMAIN>
security:
- Basic: []
- OAI-Secure: []
- SSO: []
- JWT-IAM: []
tags:
- name: Managed objects
  description: 'The inventory stores devices and other assets relevant to your IoT solution. We refer to them as managed objects and such can be “smart objects”, for example, smart electricity meters, home automation gateways or GPS devices.


    For further information, refer to Getting started > Technical concepts > Cumulocity''s domain model > Inventory > Managed objects in the Cumulocity user documentation.


    > **ⓘ Info:** The Accept header should be provided in all POST/PUT requests, otherwise an empty response body will be returned.'
paths:
  /inventory/managedObjects:
    post:
      operationId: postManagedObjectCollectionResource
      x-codegen-resource-name: createManagedObject
      parameters:
      - $ref: '#/components/parameters/acceptHeader'
      - $ref: '#/components/parameters/processingModeHeader'
      tags:
      - Managed objects
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Create one or multiple managed objects
      description: 'Create a managed object, for example, a device with temperature measurements support or a binary switch.


        In general, each managed object may consist of:


        * A unique identifier that references the object.

        * The name of the object.

        * The most specific type of the managed object.

        * A time stamp showing the last update.

        * Fragments with specific meanings, for example, `c8y_IsDevice`, `c8y_SupportedOperations`.

        * Any additional custom fragments.


        Imagine, for example, that you want to describe electric meters from different vendors. Depending on the make of the meter, one may have a relay and one may be capable to measure a single phase or three phases (for example, a three-phase electricity sensor). A fragment `c8y_ThreePhaseElectricitySensor` would identify such an electric meter. Devices'' characteristics are identified by storing fragments for each of them.


        > **ⓘ Info:** For more details about fragments with specific meanings, refer to Device management & connectivity > Device integration > Fragment library in the Cumulocity user documentation.


        External identifiers can be assigned to managed objects upon creation by specifying a list in `externalIds` field.

        Given external identifiers must be valid and not be already assigned to another managed object or the request to create a single or multiple managed objects will fail with a client error and not create anything.


        #### Bulk create


        A bulk request creates at most 50 managed objects; the response lists them in request order.

        All of them are validated, and their external identifiers checked, before anything is created, so a failed check creates nothing.

        An external identifier may occur only once in the request.


        Part of the request is created only if a failure occurs while writing, for example, a concurrent request binds the same external identifier (`409`), or the datastore fails (`500`).

        The error''s `bulkRequest.fragmentType` then names a fragment that each created managed object carries with its request position, for example, `"c8y_BatchId_7c8e1e0a-3b2f-4f6e-9a51-5d2c7e4b9f10": { "index": 3 }`.

        To complete the request without duplicates:


        1. Find the created managed objects with `GET /inventory/managedObjects?fragmentType=&pageSize=50`. If the lookup fails, retry it, never the bulk request.

        2. Re-send only the positions the lookup did not return. This also applies to `failedIndex`, which may have been created.

        3. Managed objects found may have incomplete external identifiers or group assignment.


        The fragment is not in the response or notifications, and is removed on success; if removal fails, it stays.

        Remove it with a bulk update setting it to `null`, or ignore fragments starting with `c8y_BatchId_`. The prefix is reserved and dropped from managed objects you create.


        Required roles


        ROLE_INVENTORY_ADMIN OR ROLE_INVENTORY_CREATE OR ROLE_MANAGED_OBJECT_ADMIN OR ROLE_MANAGED_OBJECT_CREATE'
      requestBody:
        required: true
        content:
          application/vnd.com.nsn.cumulocity.managedobject+json:
            schema:
              $ref: '#/components/schemas/managedObjectCreate'
            example:
              name: My tracking device
              c8y_IsDevice: {}
              c8y_DeviceTypes:
              - deviceSubsetType
              c8y_SupportedOperations:
              - c8y_Restart
          application/vnd.com.nsn.cumulocity.managedobjectcollection+json:
            schema:
              $ref: '#/components/schemas/ManagedObjectCollectionCreate'
            example:
              managedObjects:
              - name: My tracking device
                c8y_IsDevice: {}
                c8y_DeviceTypes:
                - deviceSubsetType
                c8y_SupportedOperations:
                - c8y_Restart
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request POST "https://<TENANT_DOMAIN>/inventory/managedObjects" \

          --header "Authorization: Basic <AUTHORIZATION>" \

          --header "Accept: application/json" \

          --header "Content-Type: application/json" \

          --data-raw ''<Payload>''

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/inventory/managedObjects");

          client.Timeout = -1;


          var request = new RestRequest(Method.POST);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");

          request.AddHeader("Content-Type", "application/json");

          request.AddHeader("Accept", "application/json");

          request.AddParameter("application/json", "<Payload>",  ParameterType.RequestBody);


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.post(\"https://<TENANT_DOMAIN>/inventory/managedObjects\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .header(\"Content-Type\", \"application/json\")\n    .header(\"Accept\", \"application/json\")\n    .body(\"<Payload>\")\n    .asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"POST\", \"https://<TENANT_DOMAIN>/inventory/managedObjects\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\",\n        \"Accept\": \"application/json\",\n        \"Content-Type\": \"application/json\"\n    })\n    .send(JSON.stringify( <Payload> ))\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\nimport json\n\nurl = \"https://<TENANT_DOMAIN>/inventory/managedObjects\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\",\n  \"Accept\": \"application/json\",\n  \"Content-Type\": \"application/json\"\n}\nresponse = requests.request(\"POST\", url, headers=headers, data = json.dumps(<Payload>))\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          description: All managed objects of the bulk request were created. The `managedObjects` array has the same order as in the request.
          content:
            application/vnd.com.nsn.cumulocity.managedobjectcollection+json:
              schema:
                $ref: '#/components/schemas/ManagedObjectCollection'
        '201':
          description: A managed object was created.
          content:
            application/vnd.com.nsn.cumulocity.managedobject+json:
              schema:
                $ref: '#/components/schemas/managedObject'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '409':
          description: 'Conflict – An external identifier is already bound to another managed object.

            '
          content:
            application/vnd.com.nsn.cumulocity.error+json:
              schema:
                $ref: '#/components/schemas/bulkRequestError'
              examples:
                bound_before_the_request:
                  description: An external identifier was already bound to another managed object when the request was received. Nothing was created.
                  value:
                    error: identity/Duplicate
                    info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
                    bulkRequest:
                      failedIndex: 3
                bound_during_the_request:
                  description: Another request bound the external identifier while the bulk request was being processed. Part of the bulk request may have been created.
                  value:
                    error: identity/Duplicate
                    info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
                    bulkRequest:
                      failedIndex: 3
                      fragmentType: c8y_BatchId_7c8e1e0a-3b2f-4f6e-9a51-5d2c7e4b9f10
        '422':
          $ref: '#/components/responses/invalidBulkPayload'
        '500':
          description: Internal Server Error – For a bulk request, part of it may have been created.
          content:
            application/vnd.com.nsn.cumulocity.error+json:
              schema:
                $ref: '#/components/schemas/bulkRequestError'
              example:
                error: inventory/Internal Server Error
                info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
                bulkRequest:
                  failedIndex: 17
                  fragmentType: c8y_BatchId_7c8e1e0a-3b2f-4f6e-9a51-5d2c7e4b9f10
    put:
      operationId: putManagedObjectCollectionResource
      x-codegen-resource-name: updateManagedObjects
      parameters:
      - $ref: '#/components/parameters/acceptHeader'
      - $ref: '#/components/parameters/processingModeHeader'
      tags:
      - Managed objects
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Update multiple managed objects at once
      description: 'Updates multiple managed objects (for example, devices) by their given IDs.


        The maximum number of managed objects that can be updated in a single bulk request is 50.

        Each ID can occur only once in the request.

        Updating `externalIds` is not supported through this operation; use the Identity API instead.


        All managed objects of the bulk request are validated, and checked to exist, before anything is updated.

        If any of these checks fails, the request fails with a client error and nothing is updated.

        The error response identifies the failed managed object in `bulkRequest`. A duplicate ID fails the whole request.


        If the request fails while the managed objects are updated, for example, when the datastore fails, part of them may have been updated.

        Retrieve the managed objects by their IDs to find out their current state.


        Required roles


        ROLE_INVENTORY_ADMIN OR ROLE_MANAGED_OBJECT_ADMIN OR owner of the source OR MANAGE_OBJECT_ADMIN permission on the source'
      requestBody:
        required: true
        content:
          application/vnd.com.nsn.cumulocity.managedobjectcollection+json:
            schema:
              $ref: '#/components/schemas/ManagedObjectCollectionUpdate'
            example:
              managedObjects:
              - c8y_IsDevice: {}
                name: My tracking device
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request PUT "https://<TENANT_DOMAIN>/inventory/managedObjects" \

          --header "Authorization: Basic <AUTHORIZATION>" \

          --header "Accept: application/json" \

          --header "Content-Type: application/json" \

          --data-raw ''<Payload>''

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/inventory/managedObjects");

          client.Timeout = -1;


          var request = new RestRequest(Method.PUT);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");

          request.AddHeader("Content-Type", "application/json");

          request.AddHeader("Accept", "application/json");

          request.AddParameter("application/json", "<Payload>",  ParameterType.RequestBody);


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.put(\"https://<TENANT_DOMAIN>/inventory/managedObjects\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .header(\"Content-Type\", \"application/json\")\n    .header(\"Accept\", \"application/json\")\n    .body(\"<Payload>\")\n    .asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"PUT\", \"https://<TENANT_DOMAIN>/inventory/managedObjects\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\",\n        \"Accept\": \"application/json\",\n        \"Content-Type\": \"application/json\"\n    })\n    .send(JSON.stringify( <Payload> ))\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\nimport json\n\nurl = \"https://<TENANT_DOMAIN>/inventory/managedObjects\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\",\n  \"Accept\": \"application/json\",\n  \"Content-Type\": \"application/json\"\n}\nresponse = requests.request(\"PUT\", url, headers=headers, data = json.dumps(<Payload>))\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          description: All managed objects were updated.
          content:
            application/vnd.com.nsn.cumulocity.managedobjectcollection+json:
              schema:
                $ref: '#/components/schemas/ManagedObjectCollection'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '404':
          description: Managed object not found.
          content:
            application/vnd.com.nsn.cumulocity.error+json:
              schema:
                $ref: '#/components/schemas/bulkRequestError'
              example:
                error: inventory/Not Found
                info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
                bulkRequest:
                  failedIndex: 1
        '422':
          $ref: '#/components/responses/invalidBulkPayload'
    get:
      operationId: getManagedObjectCollectionResource
      x-codegen-resource-name: getManagedObjects
      parameters:
      - $ref: '#/components/parameters/queryParam_inventory_childAdditionId'
      - $ref: '#/components/parameters/queryParam_inventory_childAssetId'
      - $ref: '#/components/parameters/queryParam_inventory_childDeviceId'
      - $ref: '#/components/parameters/queryParam_currentPage'
      - $ref: '#/components/parameters/queryParam_fragmentType'
      - $ref: '#/components/parameters/queryParam_inventory_ids'
      - $ref: '#/components/parameters/queryParam_inventory_onlyRoots'
      - $ref: '#/components/parameters/queryParam_inventory_owner'
      - $ref: '#/components/parameters/queryParam_pageSize'
      - $ref: '#/components/parameters/queryParam_inventory_deviceQuery'
      - $ref: '#/components/parameters/queryParam_query'
      - $ref: '#/components/parameters/queryParam_skipChildrenNames'
      - $ref: '#/components/parameters/queryParam_inventory_textPrefix'
      - $ref: '#/components/parameters/queryParam_inventory_type'
      - $ref: '#/components/parameters/queryParam_inventory_withChildren'
      - $ref: '#/components/parameters/queryParam_inventory_withChildrenCount'
      - $ref: '#/components/parameters/queryParam_inventory_withGroups'
      - $ref: '#/components/parameters/queryParam_withParents'
      - $ref: '#/components/parameters/queryParam_withTotalElements'
      - $ref: '#/components/parameters/queryParam_withTotalPages'
      - $ref: '#/components/parameters/queryParam_withLatestValues'
      tags:
      - Managed objects
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Retrieve all managed objects
      description: Retrieve all managed objects (for example, devices, assets, etc.) registered in your tenant, or a subset based on queries.
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request GET "https://<TENANT_DOMAIN>/inventory/managedObjects" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/inventory/managedObjects");

          client.Timeout = -1;


          var request = new RestRequest(Method.GET);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.get(\"https://<TENANT_DOMAIN>/inventory/managedObjects\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"GET\", \"https://<TENANT_DOMAIN>/inventory/managedObjects\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/inventory/managedObjects\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"GET\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          $ref: '#/components/responses/inventoryObjectCollectionFound'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '422':
          $ref: '#/components/responses/invalidData'

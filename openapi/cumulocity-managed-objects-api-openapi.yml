    put:
      operationId: putManagedObjectResource
      x-codegen-resource-name: updateManagedObject
      parameters:
      - $ref: '#/components/parameters/acceptHeader'
      - $ref: '#/components/parameters/processingModeHeader'
      tags:
      - Managed objects
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Update a specific managed object
      description: 'Update a specific managed object (for example, device) by a given ID.


        For example, if you want to specify that your managed object is a device, you must add the fragment `c8y_IsDevice`.


        The endpoint can also be used as a device availability heartbeat.

        If you only specifiy the `id`, it updates the date when the last message was received and no other property.

        The response then only contains the `id` instead of the full managed object.


        Required roles


        ROLE_INVENTORY_ADMIN OR ROLE_MANAGED_OBJECT_ADMIN OR owner of the source OR MANAGE_OBJECT_ADMIN permission on the source'
      requestBody:
        required: true
        content:
          application/vnd.com.nsn.cumulocity.managedobject+json:
            example:
              c8y_IsDevice: {}
              name: My tracking device
            schema:
              $ref: '#/components/schemas/managedObject'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request PUT "https://<TENANT_DOMAIN>/inventory/managedObjects/{id}" \

          --header "Authorization: Basic <AUTHORIZATION>" \

          --header "Accept: application/json" \

          --header "Content-Type: application/json" \

          --data-raw ''<Payload>''

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/inventory/managedObjects/{id}");

          client.Timeout = -1;


          var request = new RestRequest(Method.PUT);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");

          request.AddHeader("Content-Type", "application/json");

          request.AddHeader("Accept", "application/json");

          request.AddParameter("application/json", "<Payload>",  ParameterType.RequestBody);


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.put(\"https://<TENANT_DOMAIN>/inventory/managedObjects/{id}\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .header(\"Content-Type\", \"application/json\")\n    .header(\"Accept\", \"application/json\")\n    .body(\"<Payload>\")\n    .asString();\nSystem.out.println(response);\n"
      - lang: Node.js

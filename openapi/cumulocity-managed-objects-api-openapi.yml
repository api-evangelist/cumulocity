        - deviceSubsetType
        c8y_SupportedOperations:
        - c8y_Restart
  parameters:
    queryParam_inventory_textPrefix:
      name: text
      in: query
      description: 'Perform full-text search on managed objects. The following properties are examined: `id`, `type`, `name`, `owner`, `externalIds`.


        The search value is processed using full-text tokenization: the provided string is split into individual tokens at whitespace and certain special characters (such as `/`, `-`, `.`), and the search matches managed objects that contain **any** of those tokens in the examined properties.


        For example, searching for `abc/def-ghi` produces the tokens `abc`, `def`, and `ghi`. As a result, managed objects whose examined properties contain any of these tokens will be returned, which may include unintended results.


        To search for an exact phrase, wrap the value in double quotes (for example, `text="abc/def-ghi"`). This restricts results to managed objects that contain the full phrase rather than any individual token.


        > **&#9432; Info:** If you need an exact match on a specific property, consider using the `query` parameter with an explicit filter expression instead (for example, `$filter=(name+eq+''abc/def-ghi'')`).

        '
      schema:
        type: string
        minLength: 1
        example: my_value
    processingModeHeader:
      name: X-Cumulocity-Processing-Mode
      in: header
      description: Used to explicitly control the processing mode of the request. See [Processing mode](#processing-mode) for more details.
      required: false
      schema:
        type: string
        default: PERSISTENT
        enum:
        - PERSISTENT
        - TRANSIENT
        - QUIESCENT
        - CEP
        example: PERSISTENT
    queryParam_currentPage:
      name: currentPage
      in: query
      description: The current page of the paginated results.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 3
    queryParam_withTotalElements:
      name: withTotalElements
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of elements. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalElements` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_inventory_childAssetId:
      name: childAssetId
      in: query
      description: Search for a specific child asset and list all the groups to which it belongs.
      schema:
        type: string
        minLength: 1
        example: '200'
    queryParam_inventory_childAdditionId:
      name: childAdditionId
      in: query
      description: Search for a specific child addition and list all the groups to which it belongs.
      schema:
        type: string
        minLength: 1
        example: '3003'
    queryParam_inventory_onlyRoots:
      name: onlyRoots
      in: query
      description: When set to `true` it returns managed objects which don't have any parent. If the current user doesn't have access to the parent, this is also root for the user.
      schema:
        type: boolean
        default: false
        example: true
    queryParam_withLatestValues:
      name: withLatestValues
      in: query
      description: "If set to true the platform returns managed objects with the fragment `c8y_LatestMeasurements`, which contains the latest measurement values reported by the device to the platform. Additionally returned managed objects can have fragment `c8y_PreviousMeasurements` if there was a value of a given series previous to the latest.  \n\n> **⚠️ Feature Preview:** The parameter is a part of the Latest Measurement feature which is still under public preview.\n"
      schema:
        type: boolean
        default: false
        example: true
    queryParam_withTotalPages:
      name: withTotalPages
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of pages. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalPages` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_inventory_withChildren:
      name: withChildren
      in: query
      description: Determines if children with ID and name should be returned when fetching the managed object. Set it to `false` to improve query performance. The default behavior can be controlled by the feature toggle `core.inventory.without.children`. When this toggle is disabled, the default value reverts to `true` for backward compatibility.
      schema:
        type: boolean
        default: false
        example: false
    queryParam_inventory_cascade:
      name: cascade
      in: query
      description: When set to `true` and the managed object is a device or group, all the hierarchy will be deleted.
      schema:
        type: boolean
        default: false
        example: true
    managedObjectId:
      name: id
      in: path
      description: Unique identifier of the managed object.
      required: true
      schema:
        type: string
        minLength: 1
        example: '251982'
    queryParam_inventory_owner:
      name: owner
      in: query
      description: Username of the owner of the managed objects.
      schema:
        type: string
        minLength: 1
        example: manga
    queryParam_skipChildrenNames:
      name: skipChildrenNames
      in: query
      description: When set to `true`, the returned references of child devices won't contain their names.
      schema:
        type: boolean
        default: false
        example: true
    queryParam_inventory_forceCascade:
      name: forceCascade
      in: query
      description: When set to `true` all the hierarchy will be deleted without checking the type of managed object. It takes precedence over the parameter `cascade`.
      schema:
        type: boolean
        default: false
        example: true
    queryParam_inventory_withDeviceUser:
      name: withDeviceUser
      in: query
      description: When set to `true` and the managed object is a device, it deletes the associated device user (credentials).
      schema:
        type: boolean
        default: false
        example: true
    queryParam_withParents:
      name: withParents
      in: query
      description: 'When withParents is set to `true`, the request will include all ancestors from all the levels above the device in the hierarchy. If no parents exist, an empty array will be returned.

        > **&#9432; Info:** Inventory roles are not taken into consideration when collecting managed object parents, so basic information about all ancestors will be returned.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_fragmentType:
      name: fragmentType
      in: query
      description: A characteristic which identifies a managed object or event, for example, geolocation, electricity sensor, relay state.
      schema:
        type: string
        minLength: 1
        example: c8y_IsDevice
    queryParam_inventory_withChildrenCount:
      name: withChildrenCount
      in: query
      description: When set to `true`, the returned result will contain the total number of children in the respective objects (`childAdditions`, `childAssets` and `childDevices`).
      schema:
        type: boolean
        default: false
        example: true
    queryParam_inventory_withGroups:
      name: withGroups
      in: query
      description: When set to `true` it returns additional information about the groups to which the searched managed object belongs. This results in setting the `assetParents` property with additional information about the groups.
      schema:
        type: boolean
        default: false
        example: true
    queryParam_inventory_deviceQuery:
      name: q
      in: query
      description: Similar to the parameter `query`, but it assumes that this is a device query request and it adds automatically the search criteria `fragmentType=c8y_IsDevice`.
      schema:
        type: string
        minLength: 1
        example: $filter=(owner+eq+'manga')
    queryParam_inventory_childDeviceId:
      name: childDeviceId
      in: query
      description: Search for a specific child device and list all the groups to which it belongs.
      schema:
        type: string
        minLength: 1
        example: '2001'
    acceptHeader:
      name: Accept
      in: header
      description: Advertises which content types, expressed as MIME types, the client is able to understand.
      required: false
      schema:
        type: string
        minLength: 1
        example: application/json
    queryParam_inventory_type:
      name: type
      in: query
      description: The type of managed object to search for.
      schema:
        type: string
        minLength: 1
        example: c8y_DeviceGroup
    queryParam_inventory_ids:
      name: ids
      in: query
      description: 'The managed object IDs to search for.

        >**&#9432; Info:** If you query for multiple IDs at once, comma-separate the values.

        '
      schema:
        type: array
        items:
          type: string
          minLength: 1
        example:
        - '200'
        - '300'
      style: form
      explode: false
    queryParam_query:
      name: query
      in: query
      description: Use query language to perform operations and/or filter the results. Details about the properties and supported operations can be found in [Query language](#tag/Query-language).
      schema:
        type: string
        minLength: 1
        example: $filter=(owner+eq+'manga')
    queryParam_pageSize:
      name: pageSize
      in: query
      description: Indicates how many entries of the collection shall be returned. The upper limit for one page is 2,000 objects.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 5
        example: 10
  responses:
    inventoryObjectNotFound:
      description: Managed object not found.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: inventory/Not Found
            message: Finding device data from database failed
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
    inventoryObjectDeleteConflict:
      description: Conflict – The device user cannot be deleted with `withDeviceUser=true` because it owns other managed objects.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: inventory/Update Conflict
            message: Can't delete user because it is used by another managed object
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
    inventoryObjectDeleteTooManyRequests:
      description: Too Many Requests – Too many delete operations are in progress.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: inventory/Too Many Requests
            message: Too many delete operations in progress.
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
    inventoryObjectDeleteInvalidData:
      description: Unprocessable Entity – The managed object cannot be deleted through the Inventory API, for example a binary, a tenant or a monitored application.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: inventory/Invalid Data
            message: Cannot delete managed object.
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
    unauthorizedError:
      description: Authentication information is missing or invalid.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: security/Unauthorized
            message: 'Invalid credentials! : Bad credentials'
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
    inventoryObjectFound:
      description: The request has succeeded and the object is sent in the response.
      content:
        application/vnd.com.nsn.cumulocity.managedobject+json:
          schema:
            $ref: '#/components/schemas/managedObject'
    invalidData:
      description: Invalid data was sent.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: inventory/Invalid Data
            message: 'Find by filter query failed : Query could not be understood.'
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
    operationNotAuthorized:
      description: Not authorized to perform this operation.
    inventoryObjectCollectionFound:
      description: The request has succeeded and the collection of objects is sent in the response.
      content:
        application/vnd.com.nsn.cumulocity.managedobjectcollection+json:
          schema:
            $ref: '#/components/schemas/ManagedObjectCollection'
    invalidBulkPayload:
      description: Unprocessable Entity – invalid payload.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/bulkRequestError'
          example:
            error: undefined/validationError
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
            bulkRequest:
              failedIndex: 2
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: 'The authorization header is formed as `Basic <Base64(<tenantID>/<c8yuser>:<password>)>`. For instance, if your tenantID, username and password are **t0071234**, **testuser** and **secret123** respectively, you can generate the Base64 string with the following command:


        ```shell

        $ echo -n t0071234/testuser:secret123 | base64

        ```


        and your authorization header would look like this:


        ```

        "Authorization": "Basic dDAwNzEyMzQvdGVzdHVzZXI6c2VjcmV0MTIz"

        ```

        '
    OAI-Secure:
      type: http
      scheme: bearer
      description: 'This is the recommended authorization method because it provides high security using authorization tokens to prove the identity of the user, and it is the default login mode on creating new tenants. This mode is an enhancement of the previous OAuth Internal authentication (available prior to 10.13.0).


        For more details about OAI-Secure authentication, see [Platform administration > Authentication > Basic settings > Login settings](https://www.cumulocity.com/docs/authentication/basic-settings/#login-settings) in the Cumulocity user documentation.

        '
    SSO:
      type: oauth2
      description: "The login with SSO requires a correct configuration on the [Cumulocity side](https://www.cumulocity.com/docs/authentication/sso/). With the configuration, an additional button is available on the Login page. After clicking the button, the user is redirected to authenticate with the configured authorization server. On successful login, the user is redirected to Cumulocity.\n\nAuthentication details are exchanged using cookies. There are two parts to it, the first is the authentication cookie that is handled automatically by the Cumulocity platform. The second is the XSRF-TOKEN cookie. When a client receives the cookie, it should take the value and put it in the X-XSRF-TOKEN request header in all subsequent requests.\n\nThe flow of authenticating with authentication code grant is as follows:\n\n![Authentication flow](images/oauth-simple-flow.png)\n\nThe first request executed by the browser is:\n\n```http\nGET /tenant/loginOptions\nHost: https://<TENANT_DOMAIN>\nAccept: application/vnd.com.nsn.cumulocity.loginoptioncollection+json\n```\n\nResponse sample:\n\n```json\n{\n    \"loginOptions\": [\n        {\n            \"buttonName\": \"Login with oauth\",\n            \"grantType\": \"<AUTHORIZATION_CODE>\",\n            \"initRequest\": \"https://<TENANT_DOMAIN>/tenant/oauth?response_type=code&tenant_id=<TENANT_ID>\",\n            \"self\": \"https://<TENANT_DOMAIN>/tenant/loginOptions/oauth2\",\n            \"type\": \"oauth2\"\n        },\n        ...\n    ],\n    \"self\": \"http://<TENANT_DOMAIN>/tenant/loginOptions/\"\n}\n```\n\nThe browser must invoke the request provided in the initRequest parameter.\n\nThe initRequest initiates the redirect, in which the user is prompted for credentials. After successful login, the user is redirected back to the browser, where it must capture the code request parameter. Then the request to exchange the code for the token is as follows:\n\n```http\nPOST /tenant/oauth?grant_type=authorization_code&code=<CODE>\nHost: https://<TENANT_DOMAIN>\n```\n\nA successful response will have no body but the following response headers:\n\n```\nSet-Cookie: authorization=<TOKEN>;\nSet-Cookie: XSRF-TOKEN=<XSRF-TOKEN>;\n```\n\nThe authorization cookie is valid for two weeks.\n"
      flows:
        clientCredentials:
          tokenUrl: /tenant/oauth?grant_type=authorization_code&code=<CODE>
          scopes: {}
    JWT-IAM:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'This kind of authentication substitutes the JWT authentication with OAuth2 access tokens from your Identity and Access Management (IAM).

        You can enable this in the [SSO configuration](https://www.cumulocity.com/docs/authentication/sso/).


        The HTTP header must include:


        ```

        "Authorization": "Bearer <Access token>"

        ```


        When a request with a bearer token in the header is received, Cumulocity checks if the access token is from your IAM (that is, if authentication is enabled in your SSO configuration), and verifies the authenticity of

        the token remotely against the IAM.

        '

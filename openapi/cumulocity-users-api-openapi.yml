          description: The request has succeeded and the TFA settings are sent in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userTfaData'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/accessDenied'

openapi: 3.2.0
info:
  title: Cumulocity Edge Software Updates API
  version: 10.18.0
  description: 'Single-node on-premises deployment of Cumulocity that runs the full platform locally (inventory,

    events, measurements, alarms, streaming analytics, UI) and optionally syncs selected data to a cloud

    tenant. Targets factory floors, vessels, and regulated/air-gapped environments.

    '
servers:
- url: https://edge.local
- url: https://{edgeHost}
  variables:
    edgeHost:
      default: edge.local
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Software Updates
paths:
  /service/edge/updates:
    get:
      tags:
      - Software Updates
      summary: List Available Edge Updates
      operationId: listEdgeUpdates
      responses:
        '200':
          description: Available Edge software releases.
    post:
      tags:
      - Software Updates
      summary: Install an Edge Update
      operationId: installEdgeUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
      responses:
        '202':
          description: Update started.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

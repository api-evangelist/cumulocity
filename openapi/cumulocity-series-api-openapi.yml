openapi: 3.2.0
info:
  title: Cumulocity Measurement Series API
  version: 10.20.0
  description: 'Ingest, query, and delete device measurements (telemetry data points) including temperature, voltage,

    location, and arbitrary custom fragments with units. Supports time-range queries, source/type filters,

    series aggregations (hourly/daily), and bulk creation.

    '
servers:
- url: https://{tenant}.cumulocity.com
  variables:
    tenant:
      default: example
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Series
paths:
  /measurement/measurements/series:
    get:
      tags:
      - Series
      summary: Retrieve Series Aggregations
      operationId: getSeries
      parameters:
      - name: source
        in: query
        required: true
        schema:
          type: string
      - name: series
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: aggregationType
        in: query
        schema:
          type: string
          enum:
          - MINUTELY
          - HOURLY
          - DAILY
      - name: dateFrom
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Series aggregation result.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

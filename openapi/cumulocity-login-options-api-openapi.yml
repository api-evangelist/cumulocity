          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: 'Unirest.setTimeouts(0, 0);

          HttpResponse<String> response = Unirest.get("https://<TENANT_DOMAIN>/tenant/loginOptions").asString();

          '
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"GET\", \"https://<TENANT_DOMAIN>/tenant/loginOptions\")\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: 'import requests


          response = requests.request("GET", "https://<TENANT_DOMAIN>/tenant/loginOptions")

          print(response.text.encode("utf8"))

          '
      responses:
        '200':

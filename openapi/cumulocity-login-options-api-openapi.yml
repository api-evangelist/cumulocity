      responses:
        '204':
          description: An inventory access mapping was removed.
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '404':
          $ref: '#/components/responses/inventoryAccessMappingNotFound'
  /tenant/loginOptions/{typeOrId}/restrict:

openapi: 3.2.0
info:
  title: Cumulocity Tenant Tenant Statistics API
  version: 10.20.0
  description: 'Manage Cumulocity tenants (sub-tenants in enterprise and management hierarchies), tenant options

    (key-value config including encrypted secrets), tenant applications, and tenant usage statistics.

    '
servers:
- url: https://{tenant}.cumulocity.com
  variables:
    tenant:
      default: example
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Tenant Statistics
paths:
  /tenant/statistics:
    get:
      tags:
      - Tenant Statistics
      summary: List Tenant Usage Statistics
      operationId: listTenantStatistics
      parameters:
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Per-day tenant usage statistics.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

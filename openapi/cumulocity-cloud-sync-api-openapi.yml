openapi: 3.2.0
info:
  title: Cumulocity Edge Cloud Sync API
  version: 10.18.0
  description: 'Single-node on-premises deployment of Cumulocity that runs the full platform locally (inventory,

    events, measurements, alarms, streaming analytics, UI) and optionally syncs selected data to a cloud

    tenant. Targets factory floors, vessels, and regulated/air-gapped environments.

    '
servers:
- url: https://edge.local
- url: https://{edgeHost}
  variables:
    edgeHost:
      default: edge.local
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Cloud Sync
paths:
  /service/edge/cloud-sync:
    get:
      tags:
      - Cloud Sync
      summary: Retrieve Cloud Sync Configuration
      operationId: getCloudSyncConfiguration
      responses:
        '200':
          description: Current cloud-sync configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSyncConfiguration'
    put:
      tags:
      - Cloud Sync
      summary: Update Cloud Sync Configuration
      operationId: updateCloudSyncConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudSyncConfiguration'
      responses:
        '200':
          description: Cloud-sync configuration updated.
components:
  schemas:
    CloudSyncConfiguration:
      type: object
      properties:
        enabled:
          type: boolean
        targetTenantUrl:
          type: string
          format: uri
        targetTenantId:
          type: string
        syncedDataTypes:
          type: array
          items:
            type: string
            enum:
            - INVENTORY
            - MEASUREMENTS
            - EVENTS
            - ALARMS
            - OPERATIONS
            - AUDIT
        bandwidthLimitKbps:
          type: integer
        bufferingPolicy:
          type: string
          enum:
          - BLOCK
          - DROP_OLDEST
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

      - SSO: []
      summary: Sets TFA settings for a specific tenant
      description: 'Sets the two-factor authentication settings of a specific tenant for a specific tenant ID.


        Required roles


        ((ROLE_TENANT_MANAGEMENT_ADMIN OR ROLE_TENANT_MANAGEMENT_UPDATE) AND (the current tenant is its parent OR the current user belongs to the tenant)))'
      requestBody:

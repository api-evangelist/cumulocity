  /devicecontrol/deviceAccessToken:
    post:
      operationId: postDeviceAccessTokenResource
      x-codegen-resource-name: obtainAccessToken
      parameters:
      - $ref: '#/components/parameters/acceptHeader'
      - $ref: '#/components/parameters/sslCertChainInHeader'
      tags:
      - Trusted certificates
      security: []
      summary: Obtain device access token
      description: 'Only those devices which are registered to use cert auth can authenticate via mTLS protocol and retrieve JWT token. Device access token API works only on port 8443 via mutual TLS (mTLS) connection.

        Immediate issuer of client certificate must present in Platform''s truststore, if not then whole certificate chain needs to send in header and root or any intermediate certificate must be present in the Platform''s truststore.

        We must have the following:

        * private_key

        * client certificate

        * whole certificate chain (Optional - This API requires the client to send a custom header `X-SSL-CERT-CHAIN` only if the immediate issuer of the client''s certificate is not uploaded as a trusted certificate on the platform. If the immediate issuer is already uploaded and trusted, the header can be omitted)'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request POST "https://<TENANT_DOMAIN>:8443/devicecontrol/deviceAccessToken" --cert domain-cert.pem --key domain-private-key.pem \

          --header "Accept: application/json" \

          --header "X-Ssl-Cert-Chain:{cert-chain}"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>:8443/devicecontrol/deviceAccessToken");

          client.Timeout = -1;

          var request = new RestRequest(Method.POST);

          request.AddHeader("Accept", "application/json");

          request.AddHeader("X-Ssl-Cert-Chain", {cert-chain});

          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: 'KeyStore keyStore = KeyStore.getInstance("JKS");

          keyStore.load(null, null);

          // x509Certificate is domain certificate

          // domainKeyPair is KeyPair for domain certificate

          keyStore.setKeyEntry("cert", this.domainKeyPair.getPrivate(), keystorePassword, new Certificate[]{x509Certificate});

          KeyManagerFactory keyManagerFactory = KeyManagerFactory.getInstance(KeyManagerFactory.getDefaultAlgorithm());

          keyManagerFactory.init(keyStore, keystorePassword);

          TrustManagerFactory trustManagerFactory = TrustManagerFactory.getInstance(TrustManagerFactory.getDefaultAlgorithm());

          KeyStore trustStore = KeyStore.getInstance(KeyStore.getDefaultType());

          trustStore.load(null, null);

          trustStore.setCertificateEntry("server_public_key", x509Certificate);

          trustManagerFactory.init(trustStore);

          SSLContext sslContext = SSLContext.getInstance("TLS");

          sslContext.init(keyManagerFactory.getKeyManagers(), trustManagerFactory.getTrustManagers(), null);

          HttpClient httpClient = HttpClient.newBuilder().sslContext(sslContext).build();

          HttpRequest request = HttpRequest.newBuilder().uri(new URI(https://<TENANT_DOMAIN>:8443/devicecontrol/deviceAccessToken))

          .POST(HttpRequest.BodyPublishers.noBody())

          .header("Accept", "application/json")

          .header("X-ssl-Cert-Chain", {cert-chain}).build();

          HttpResponse<String> response = httpClient.send(request, HttpResponse.BodyHandlers.ofString());

          System.out.println(response.body());

          '
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"POST\", \"https://<TENANT_DOMAIN>:8443/devicecontrol/deviceAccessToken\")\n    .headers({\n        \"Accept\": \"application/json\",\n        \"X-Ssl-Cert-Chain\": {cert-chain}\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\nimport json\nurl = \"https://<TENANT_DOMAIN>:8443/devicecontrol/deviceAccessToken\"\nheaders = {\n  \"Accept\": \"application/json\",\n  \"X-Ssl-Cert-Chain\":{cert-chain}\n}\nresponse = requests.request(\"POST\", url, headers = headers, files = files)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          description: Successfully retrieved device access token from device certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deviceAccessToken'
        '400':
          $ref: '#/components/responses/unableToParseCertBadRequest'
        '401':
          $ref: '#/components/responses/x509CertificateValidationUnauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '404':
          $ref: '#/components/responses/deviceAccessTokenNotFound'
        '422':
          description: The verification was not successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                unprocessable:
                  value:
                    error: Auto registeration is failed for device/Unprocessable Entity
                    message: Cannot process certificate data.
                    info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
                invalidData:
                  value:
                    error: Invalid Data
                    message: Cannot process certificate data.
                    info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
components:
  parameters:
    processingModeHeader:
      name: X-Cumulocity-Processing-Mode
      in: header
      description: Used to explicitly control the processing mode of the request. See [Processing mode](#processing-mode) for more details.
      required: false
      schema:
        type: string
        default: PERSISTENT
        enum:
        - PERSISTENT
        - TRANSIENT
        - QUIESCENT
        - CEP
        example: PERSISTENT
    queryParam_certificateAuthority:
      name: certificateAuthority
      in: query
      description: 'When set to `true`, the tenant certificate authority will be retrieved.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_withTotalElements:
      name: withTotalElements
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of elements. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalElements` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    tenantId:
      name: tenantId
      in: path
      description: Unique identifier of a Cumulocity tenant.
      required: true
      schema:
        type: string
        minLength: 1
        example: t07007007
    queryParam_withTotalPages:
      name: withTotalPages
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of pages. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalPages` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_currentPage:
      name: currentPage
      in: query
      description: The current page of the paginated results.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 3
    sslCertChainInHeader:
      name: X-Ssl-Cert-Chain
      in: header
      description: 'Used to send a certificate chain in the header. Separate the chain with ` ` (a space character) and also each 64 bit block with ` ` (a space character).


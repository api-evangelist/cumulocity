  /tenant/tenants/{tenantId}/trusted-certificates/{fingerprint}:
    parameters:
    - $ref: '#/components/parameters/tenantId'
    - $ref: '#/components/parameters/fingerprint'
    get:
      operationId: getTrustedCertificateResource
      x-codegen-resource-name: getTrustedCertificate
      tags:
      - Trusted certificates
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Retrieve a stored certificate
      description: 'Retrieve the data of a stored trusted certificate (by a given fingerprint) of a specific tenant (by a given ID).


        Required roles


        (ROLE_TENANT_MANAGEMENT_ADMIN OR ROLE_TENANT_ADMIN OR ROLE_TENANT_MANAGEMENT_READ) AND (is the current tenant OR is the management tenant)'

  /tenant/trusted-certificates/settings/crl:
    put:
      operationId: putCRLSettings
      x-codegen-resource-name: updateCRL
      tags:
      - Trusted certificates
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Add revoked certificates
      description: '> **ⓘ Info:** A certificate revocation list (CRL) is a list of digital certificates

        that have been revoked by the issuing certificate authority (CA) before expiration date.

        In Cumulocity, a CRL check can be in online or offline mode or both.


        An endpoint to add revoked certificate serial numbers for offline CRL check via payload or file.

        A file can be uploaded with either `PUT` or `POST`, a JSON payload is accepted by `PUT` only.


        For payload, a JSON object required with list of CRL entries, for example:

        ```json

        {

        "crls": [

        {

        "serialNumberInHex": "1000",

        "revocationDate": "2023-01-11T16:12:36.288Z"

        }

        ]

        }

        ```

        Each entry is composed of:

        * serialNumberInHex: Needs to be in `Hexadecimal Value`. e.g As (1000)^16 == (4096)^10, So we have to enter 1000.

        If duplicate serial number exists in payload, the existing entry stays


        * `revocationDate` - accepted Date format: `yyyy-MM-dd''T''HH:mm:ss.SSS''Z''`, for example: `2023-01-11T16:12:36.288Z`.

        This is an optional parameter and defaults to the current server UTC date time if not specified in the payload.

        If specified and the date is in future then those entries will be also defaulted to current date.


        For file upload, each file can hold at maximum 5000 revocation entries.

        Multiple upload is allowed.

        In case of duplicates, the latest (last uploaded) entry is considered.


        See below for a sample CSV file:


        | SERIAL NO. | REVOCATION DATE |

        |--|--|

        | 1000 | 2023-01-11T16:12:36.288Z |


        Each entry is composed of :

        * serialNumberInHex: Needs to be in `Hexadecimal Value`. e.g (1000)^16 == (4096)^10, So we have to enter 1000.

        If duplicate serial number exists in payload, the latest entry will be taken.


        * revocationDate: Accepted Date format: `yyyy-MM-dd''T''HH:mm:ss.SSS''Z''` e.g: 2023-01-11T16:12:36.288Z.

        This is an optional and will be default to current server UTC date time if not specified in payload.

        If specified and the date is in future then those entries will be skipped.


        The CRL setting for offline and online check can be enabled/disabled using /tenant/options.

        Keys are `crl.online.check.enabled` and `crl.offline.check.enabled` under the category `configuration`.


        Required roles


        (ROLE_TENANT_MANAGEMENT_ADMIN OR ROLE_TENANT_ADMIN) AND is the current tenant


        **⚠️ Important:** According to CRL policy, added serial numbers cannot be reversed.'
      x-code-samples:
      - lang: cURL
        source: "curl --location --request PUT 'https://<TENANT_DOMAIN>/tenant/trusted-certificates/settings/crl' \\\n--header \"Authorization: Basic <AUTHORIZATION>\" \\\n--header \"Accept: application/json\" \\\n--header \"Content-Type: application/json\" \\\n--data '{\n  \"crls\": [\n      {\n          \"serialNumberInHex\": \"<SERIAL_NO>\",\n          \"revocationDate\": \"<yyyy-MM-dd'T'HH:mm:ss.SSS'Z'\"\n      }\n  ]\n}'\nOR\ncurl --location --request PUT 'https://<TENANT_DOMAIN>/tenant/trusted-certificates/settings/crl' \\\n--header \"Authorization: Basic <AUTHORIZATION>\" \\\n--form 'file=@\"/path_to_file/CRL_bulk_registration_template.csv\"'\n"
      - lang: C#
        source: "var client = new RestClient(\"https://<TENANT_DOMAIN>/tenant/trusted-certificates/settings/crl\");\nclient.Timeout = -1;\nvar request = new RestRequest(Method.PUT);\nrequest.AddHeader(\"Authorization\", \"Basic <AUTHORIZATION>\");\nvar body = @\"{\" + \"\\n\" +\n            @\"    \"\"crls\"\": [\" + \"\\n\" +\n            @\"        {\" + \"\\n\" +\n            @\"            \"\"serialNumberInHex\"\": \"\"<SERIAL_NO>\"\",\" + \"\\n\" +\n            @\"            \"\"revocationDate\"\": \"\"<yyyy-MM-dd'T'HH:mm:ss.SSS'Z'>\"\"\" + \"\\n\" +\n            @\"        }\" + \"\\n\" +\n            @\"    ]\" + \"\\n\" +\n            @\"}\";\nrequest.AddHeader(\"Content-Type\", \"application/json\");\nrequest.AddHeader(\"Accept\", \"application/json\");\nrequest.AddStringBody(body, DataFormat.Json);\nIRestResponse response = client.Execute(request);\nConsole.WriteLine(response.Content);\nOR\nvar client = new RestClient(\"https://<TENANT_DOMAIN>/tenant/trusted-certificates/settings/crl\");\nclient.Timeout = -1;\nvar request = new RestRequest(Method.PUT);\nrequest.AlwaysMultipartFormData = true;\nrequest.AddHeader(\"Authorization\", \"Basic <AUTHORIZATION>\");\nrequest.AddFile(\"file\", \"/path_to_file/CRL_bulk_registration_template.csv\");\nIRestResponse response = client.Execute(request);\nConsole.WriteLine(response.Content);\n"
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.put(\"https://<TENANT_DOMAIN>/tenant/trusted-certificates/settings/crl\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .header(\"Content-Type\", \"application/json\")\n    .header(\"Accept\", \"application/json\")\n    .body(\"{\\n    \\\"crls\\\": [\\n        \n         {\\n            \\\"serialNumberInHex\\\": \\\"<SERIAL_NO>\\\",\\n            \n         \\\"revocationDate\\\": \\\"<yyyy-MM-dd'T'HH:mm:ss.SSS'Z'\\\"\\n        \n          }\\n    \n        ]\\n}\")\n    .asString();\nSystem.out.println(response);\nOR\nUnirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.put(\"https://<TENANT_DOMAIN>/tenant/trusted-certificates/settings/crl\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .field(\"file\", new File(\"/path_to_file/CRL_bulk_registration_template.csv\"))\n    .asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"PUT\", \"https://<TENANT_DOMAIN>/tenant/trusted-certificates/settings/crl\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\",\n        \"Accept\": \"application/json\",\n        \"Content-Type\": \"application/json\"\n    })\n    .send(JSON.stringify({\n          \"crls\": [\n            {\n              \"serialNumberInHex\": \"<SERIAL_NO>\",\n              \"revocationDate\": \"<yyyy-MM-dd'T'HH:mm:ss.SSS'Z'>\"\n            }\n          ]\n      }))\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\nOR\nvar unirest = require(\"unirest\");\nvar req = unirest(\"PUT\", \"https://<TENANT_DOMAIN>/tenant/trusted-certificates/settings/crl\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\",\n    })\n    .attach('file', '/path_to_file/CRL_bulk_registration_template.csv')\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\nimport json\nurl = \"https://<TENANT_DOMAIN>/tenant/trusted-certificates/settings/crl\"\npayload = json.dumps({\n  \"crls\": [\n    {\n      \"serialNumberInHex\": \"<SERIAL_NO>\",\n      \"revocationDate\": \"<yyyy-MM-dd'T'HH:mm:ss.SSS'Z'\"\n    }\n  ]\n})\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\",\n  \"Accept\": \"application/json\",\n  \"Content-Type\": \"application/json\"\n}\nresponse = requests.request(\"PUT\", url, headers=headers, data=payload)\nprint(response.text.encode(\"utf8\"))\nOR\nimport requests\nimport json\nurl = \"https://<TENANT_DOMAIN>/tenant/trusted-certificates/settings/crl\"\npayload = {}\nfiles=[\n('file',('cert_chain.pem',open('/path_to_file/CRL_bulk_registration_template.csv','rb'),'application/octet-stream'))\n]\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\",\n}\nresponse = requests.request(\"PUT\", url, headers=headers, data=payload, files=files)\nprint(response.text.encode(\"utf8\"))\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCRLEntries'
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  description: File to be uploaded.
                  type: string
                  format: binary
      responses:
        '204':
          description: CRLs updated successfully.
        '400':
          $ref: '#/components/responses/unableToParseCRLEntries'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/accessDenied'

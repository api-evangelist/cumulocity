openapi: 3.2.0
info:
  version: Latest
  title: Cumulocity Binaries API
  x-logo:
    url: https://www.cumulocity.com/docs/images/logo-platform.svg
    backgroundColor: '#F8F8F8'
    altText: Cumulocity
    href: https://www.cumulocity.com/api
  description: '# REST implementation


    This section describes the aspects common to all REST-based interfaces of Cumulocity. The interfaces are based on the Hypertext Transfer Protocol 1.1 using HTTPS. ## HTTP usage


    ### Application management


    Cumulocity uses a so-called "application key" to distinguish requests coming from devices and traffic from applications. If you write an application, pass the following header as part of all requests:


    ```markup

    X-Cumulocity-Application-Key:

    ```


    For example, if you registered your application in the Cumulocity Administration application with the key "myapp", your requests should contain the header:


    ```markup

    X-Cumulocity-Application-Key: myapp

    ```


    This makes your application subscribable and billable. If you implement a device, do not pass the key. > **ⓘ Info:** Make sure that you pass the key in **all** requests coming from an application. If you leave out the key,

    > the request will be considered as a device request, and the corresponding device will be marked as "available". ### Limited HTTP clients


    If you use an HTTP client that can only perform GET and POST methods in HTTP, you can emulate the other methods through an additional "X-HTTP-METHOD" header. Simply issue a POST request and add the header, specifying the actual REST method to be executed. For example, to emulate the "PUT" (modify) method, you can use:


    ```http

    POST ... X-HTTP-METHOD: PUT

    ```


    ### Processing mode


    Every update request (PUT, POST, DELETE) executes with a so-called *processing mode*. The processing modes are as follows:


    |Processing mode|Description|

    |---|---|

    |PERSISTENT (default)|Stores data in the Cumulocity database and sends data to the Streaming Analytics engine. Afterwards, Cumulocity returns the result of the request. This is the default mode.|

    |TRANSIENT|Sends data to the Streaming Analytics engine and immediately returns the results asynchronously but does not store data in Cumulocity’s database. This mode saves storage and processing costs and is useful for example when tracking devices in real time without requiring data to be stored.|

    |QUIESCENT|Behaves similar to the persistent mode with the exception that no real-time notifications will be sent.|

    |CEP|Behaves like the transient mode with the exception that no real-time notifications are sent.|


    To explicitly control the processing mode of an update request, you can use the "X-Cumulocity-Processing-Mode" header with a value of either "PERSISTENT", "TRANSIENT", "QUIESCENT" or "CEP":


    ```markup

    X-Cumulocity-Processing-Mode: PERSISTENT

    ```


    > **ⓘ Info:** Events are always delivered to CEP/Apama for all processing modes. This is independent from real-time notifications. ### Authorization


    All requests issued to Cumulocity are subject to authorization. To determine the required permissions, see the "Required role" entries for the individual requests. To learn more about the different permissions and the concept of ownership in Cumulocity, see Getting started > Technical concepts > Security aspects > Access control > Managing roles and assigning permissions in the Cumulocity user documentation. > **⚠️ Important:** In the Cumulocity API, each granular permission is identified by a unique “permission” string, which is prefixed with ROLE_ (for example, ROLE_ALARM_READ, ROLE_INVENTORY_ADMIN). Therefore, permissions are frequently referred to as “roles” throughout the API as well as in the configuration files. For example, the microservice manifest includes a requiredRoles field, which actually expects a permission string. See also the Glossary of the Cumulocity user documentation for the usage of the terms “permission” and “role” in the Cumulocity context. ### Media types


    Each type of data is associated with an own media type. The general format of media types is:


    ```markup

    application/vnd.com.nsn.cumulocity.+json;ver=;charset=UTF-8

    ```


    Each media type contains a parameter `ver` indicating the version of the type.'
servers:
- description: Cumulocity tenant
  url: https://<TENANT_DOMAIN>
security:
- Basic: []
- OAI-Secure: []
- SSO: []
- JWT-IAM: []
tags:
- name: Binaries
  description: 'Managed objects can perform operations to store, retrieve and delete binaries. One binary can store only one file. Together with the binary, a managed object is created which acts as a metadata information for the binary.


    > **ⓘ Info:** Supports only HTTP 1.1 clients.

    > **ⓘ Info:** The Accept header should be provided in all POST/PUT requests, otherwise an empty response body will be returned.'
paths:
  /inventory/binaries:
    post:
      operationId: postBinariesCollectionResource
      x-codegen-resource-name: uploadBinary
      tags:
      - Binaries
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Upload a file
      description: 'Uploading a file (binary) requires providing the following properties:


        * `object` – In JSON format, it contains information about the file.

        * `file` – Contains the file to be uploaded.


        After the file has been uploaded, the corresponding managed object will contain the fragment `c8y_IsBinary`.


        Required roles


        ROLE_INVENTORY_ADMIN OR ROLE_INVENTORY_CREATE OR ROLE_BINARY_ADMIN OR ROLE_BINARY_CREATE'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - object
              - file
              properties:
                object:
                  $ref: '#/components/schemas/binaryInfo'
                file:
                  description: Path of the file to be uploaded.
                  type: string
                  format: binary
                  example: hello.txt
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request POST "https://<TENANT_DOMAIN>/inventory/binaries" \

          --header "Authorization: Basic <AUTHORIZATION>" \

          --header "Accept: application/json" \

          --form ''object={ "name" : "HelloWorld", "type" : "text/plain" }'' \

          --form "file=@hello.txt"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/inventory/binaries");

          client.Timeout = -1;


          var request = new RestRequest(Method.POST);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");

          request.AddHeader("Accept", "application/json");

          request.AddParameter("object", "{ \"name\" : \"HelloWorld\", \"type\" : \"text/plain\" }");

          request.AddFile("file", "hello.txt");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.post(\"https://<TENANT_DOMAIN>/inventory/binaries\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .header(\"Accept\", \"application/json\")\n    .field(\"object\", \"{ \\\"name\\\" : \\\"HelloWorld\\\", \\\"type\\\" : \\\"text/plain\\\" }\")\n    .field(\"file\", new File(\"hello.txt\"))\n    .asString();\n\n    System.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"POST\", \"https://<TENANT_DOMAIN>/inventory/binaries\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\",\n        \"Accept\": \"application/json\"\n    })\n    .field(\"object\", '{ \"name\" : \"HelloWorld\", \"type\" : \"text/plain\" }')\n    .attach(\"file\", \"hello.txt\")\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/inventory/binaries\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\",\n  \"Accept\": \"application/json\"\n}\npayload = { 'object' : '{ \"name\" : \"HelloWorld\", \"type\" : \"text/plain\" }'}\nfiles = [(\"file\", open(\"hello.txt\", \"rb\"))]\n\nresponse = requests.request(\"POST\", url, headers= headers, data= payload, files= files)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '201':
          description: A file was uploaded.
          content:
            application/vnd.com.nsn.cumulocity.managedobject+json:
              schema:
                $ref: '#/components/schemas/binary'
        '400':
          $ref: '#/components/responses/invalidPayload'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
        '422':
          $ref: '#/components/responses/invalidPayload'
    get:
      operationId: getBinariesCollectionResource
      x-codegen-resource-name: getBinaries
      parameters:
      - $ref: '#/components/parameters/queryParam_inventory_childAdditionId'
      - $ref: '#/components/parameters/queryParam_inventory_childAssetId'
      - $ref: '#/components/parameters/queryParam_inventory_childDeviceId'
      - $ref: '#/components/parameters/queryParam_currentPage'
      - $ref: '#/components/parameters/queryParam_inventory_ids'
      - $ref: '#/components/parameters/queryParam_inventory_owner'
      - $ref: '#/components/parameters/queryParam_pageSize'
      - $ref: '#/components/parameters/queryParam_inventory_type'
      - $ref: '#/components/parameters/queryParam_withTotalPages'
      tags:
      - Binaries
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Search for stored files
      description: Retrieve metadata information about stored files. Search for files by query parameters. This will not download the files.
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request GET "https://<TENANT_DOMAIN>/inventory/binaries" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/inventory/binaries");

          client.Timeout = -1;


          var request = new RestRequest(Method.GET);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.get(\"https://<TENANT_DOMAIN>/inventory/binaries\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"GET\", \"https://<TENANT_DOMAIN>/inventory/binaries\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/inventory/binaries\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"GET\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          $ref: '#/components/responses/inventoryBinariesCollectionFound'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
  /inventory/binaries/{id}:
    parameters:
    - $ref: '#/components/parameters/managedObjectId'
    get:
      operationId: getBinariesResource
      x-codegen-resource-name: getBinary
      tags:
      - Binaries
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Retrieve a stored file
      description: 'Retrieve a stored file (managed object) by a given ID.

        Supports chunk download and resuming an interrupted download using the `Range` header.


        Required roles


        ROLE_INVENTORY_READ OR ROLE_BINARY_READ OR owner of the resource OR MANAGE_OBJECT_READ permission on the resource'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request GET "https://<TENANT_DOMAIN>/inventory/binaries/{id}" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/inventory/binaries/{id}");

          client.Timeout = -1;


          var request = new RestRequest(Method.GET);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.get(\"https://<TENANT_DOMAIN>/inventory/binaries/{id}\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"GET\", \"https://<TENANT_DOMAIN>/inventory/binaries/{id}\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/inventory/binaries/{id}\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"GET\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          description: The request has succeeded and the file is sent in the response.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
    put:
      operationId: putBinariesResource
      x-codegen-resource-name: replaceBinary
      tags:
      - Binaries
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Replace a file
      description: 'Upload and replace the attached file (binary) of a specific managed object by a given ID.


        Required roles


        ROLE_INVENTORY_ADMIN OR ROLE_BINARY_ADMIN OR owner of the resource OR MANAGE_OBJECT_ADMIN permission on the resource'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: The file to be uploaded.
              format: binary
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request PUT "https://<TENANT_DOMAIN>/inventory/binaries/{id}" \

          --header "Authorization: Basic <AUTHORIZATION>" \

          --header "Accept: application/json" \

          --header "Content-Type: text/plain" \

          --data-binary "@new_hello.txt"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/inventory/binaries/{id}");

          client.Timeout = -1;


          var request = new RestRequest(Method.PUT);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");

          request.AddHeader("Content-Type", "text/plain");

          request.AddHeader("Accept", "application/json");

          request.AddParameter("text/plain", "<file contents here>", ParameterType.RequestBody);


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.put(\"https://<TENANT_DOMAIN>/inventory/binaries/{id}\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .header(\"Content-Type\", \"text/plain\")\n    .header(\"Accept\", \"application/json\")\n    .body(\"<file contents here>\")\n    .asString();\n\n    System.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"PUT\", \"https://<TENANT_DOMAIN>/inventory/binaries/{id}\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\",\n        \"Accept\": \"application/json\",\n        \"Content-Type\": \"text/plain\"\n    })\n    .send(\"<file contents here>\")\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/inventory/binaries/{id}\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\",\n  \"Accept\": \"application/json\",\n  \"Content-Type\": \"text/plain\"\n}\nfiles = \"<file contents here>\"\n\nresponse = requests.request(\"PUT\", url, headers= headers, files= files)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '201':
          description: A file was uploaded.
          content:
            application/vnd.com.nsn.cumulocity.managedobject+json:
              schema:
                $ref: '#/components/schemas/binary'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
    delete:
      operationId: deleteBinariesResource
      x-codegen-resource-name: removeBinary
      tags:
      - Binaries
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Remove a stored file
      description: 'Remove a managed object and its stored file by a given ID.


        Required roles


        ROLE_INVENTORY_ADMIN OR ROLE_BINARY_ADMIN OR owner of the resource OR MANAGE_OBJECT_ADMIN permission on the resource'
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request DELETE "https://<TENANT_DOMAIN>/inventory/binaries/{id}" \

          --header "Authorization: Basic <AUTHORIZATION>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/inventory/binaries/{id}");

          client.Timeout = -1;


          var request = new RestRequest(Method.DELETE);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.delete(\"https://<TENANT_DOMAIN>/inventory/binaries/{id}\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\").asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"DELETE\", \"https://<TENANT_DOMAIN>/inventory/binaries/{id}\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\"\n    })\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/inventory/binaries/{id}\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"DELETE\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '204':
          description: A managed object and its stored file was removed.
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/operationNotAuthorized'
components:
  schemas:
    binary:
      type: object
      properties:
        c8y_IsBinary:
          description: Fragment to identify this managed object as a file.
          type: object
        contentType:
          description: Media type of the file.
          type: string
        id:
          $ref: '#/components/schemas/desc_objectId'
        lastUpdated:
          description: Date and time of the file's last update.
          type: string
          format: date-time
          readOnly: true
        length:
          description: Size of the file in bytes.
          type: integer
        name:
          description: Name of the managed object. It is set from the `object` contained in the payload.
          type: string
        owner:
          description: Username of the owner of the file.
          type: string
        self:
          $ref: '#/components/schemas/desc_self'
        type:
          description: Type of the managed object. It is set from the `object` contained in the payload.
          type: string
      example:
        c8y_IsBinary: {}
        contentType: text/plain
        id: '123153092'
        lastUpdated: '2020-10-15T22:15:17.267Z'
        length: 365
        name: HelloWorld
        owner: manga
        self: https://<TENANT_DOMAIN>/inventory/binaries/123153092
        type: text/plain
    desc_self:
      title: SelfURL
      description: A URL linking to this resource.
      type: string
      format: uri
      readOnly: true
    desc_nextPage:
      title: NextPageURL
      description: A URI reference [[RFC3986](https://tools.ietf.org/html/rfc3986)] to a potential next page of managed objects.
      type: string
      readOnly: true
    error:
      type: object
      properties:
        error:
          description: The type of error returned.
          type: string
        message:
          description: A human-readable message providing more details about the error.
          type: string
        info:
          description: A URI reference [[RFC3986](https://tools.ietf.org/html/rfc3986)] that identifies the error code reported.
          type: string
    binaryInfo:
      description: Contains information about the file.
      type: object
      properties:
        name:
          description: Name of the binary object.
          type: string
          maxLength: 1000
          example: HelloWorld
        type:
          description: Media type of the file.
          type: string
          maxLength: 1000
          example: text/plain
    pageStatistics:
      description: Information about paging statistics.
      type: object
      readOnly: true
      properties:
        currentPage:
          description: The current page of the paginated results.
          type: integer
          minimum: 1
          example: 2
        pageSize:
          description: Indicates the number of objects that the collection may contain per page. The upper limit for one page is 2,000 objects.
          type: integer
          minimum: 1
          maximum: 2000
          example: 5
        totalElements:
          description: The total number of results (elements).
          type: integer
          minimum: 0
          example: 12
        totalPages:
          description: 'The total number of paginated results (pages).


            > **&#9432; Info:** This property is returned by default except when an operation retrieves all records where values are between an upper and lower boundary, for example, querying ranges using `dateFrom`–`dateTo`. In such cases, the query parameter `withTotalPages=true` should be used to include the total number of pages (at the expense of slightly slower performance).

            '
          type: integer
          minimum: 0
          example: 3
    desc_objectId:
      title: ObjectId
      description: Unique identifier of the object.
      type: string
      minLength: 1
    desc_prevPage:
      title: PreviousPageURL
      description: A URI reference [[RFC3986](https://tools.ietf.org/html/rfc3986)] to a potential previous page of managed objects.
      type: string
      readOnly: true
    BinaryCollection:
      type: object
      properties:
        managedObjects:
          description: An array containing the results (managed objects) of the request.
          type: array
          items:
            $ref: '#/components/schemas/binary'
        next:
          $ref: '#/components/schemas/desc_nextPage'
        prev:
          $ref: '#/components/schemas/desc_prevPage'
        self:
          $ref: '#/components/schemas/desc_self'
        statistics:
          $ref: '#/components/schemas/pageStatistics'
      example:
        self: https://<TENANT_DOMAIN>/inventory/binaries?pageSize=5&currentPage=1
        managedObjects:
        - c8y_IsBinary: {}
          contentType: text/plain
          id: '123153092'
          lastUpdated: '2020-10-15T22:15:17.267Z'
          length: 365
          name: HelloWorld
          owner: manga
          self: https://<TENANT_DOMAIN>/inventory/binaries/123153092
          type: text/plain
        statistics:
          totalPages: 1
          pageSize: 5
          currentPage: 1
  parameters:
    queryParam_inventory_childAssetId:
      name: childAssetId
      in: query
      description: Search for a specific child asset and list all the groups to which it belongs.
      schema:
        type: string
        minLength: 1
        example: '200'
    queryParam_inventory_childAdditionId:
      name: childAdditionId
      in: query
      description: Search for a specific child addition and list all the groups to which it belongs.
      schema:
        type: string
        minLength: 1
        example: '3003'
    queryParam_withTotalPages:
      name: withTotalPages
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of pages. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalPages` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_currentPage:
      name: currentPage
      in: query
      description: The current page of the paginated results.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 3
    queryParam_inventory_ids:
      name: ids
      in: query
      description: 'The managed object IDs to search for.

        >**&#9432; Info:** If you query for multiple IDs at once, comma-separate the values.

        '
      schema:
        type: array
        items:
          type: string
          minLength: 1
        example:
        - '200'
        - '300'
      style: form
      explode: false
    managedObjectId:
      name: id
      in: path
      description: Unique identifier of the managed object.
      required: true
      schema:
        type: string
        minLength: 1
        example: '251982'
    queryParam_inventory_owner:
      name: owner
      in: query
      description: Username of the owner of the managed objects.
      schema:
        type: string
        minLength: 1
        example: manga
    queryParam_inventory_childDeviceId:
      name: childDeviceId
      in: query
      description: Search for a specific child device and list all the groups to which it belongs.
      schema:
        type: string
        minLength: 1
        example: '2001'
    queryParam_inventory_type:
      name: type
      in: query
      description: The type of managed object to search for.
      schema:
        type: string
        minLength: 1
        example: c8y_DeviceGroup
    queryParam_pageSize:
      name: pageSize
      in: query
      description: Indicates how many entries of the collection shall be returned. The upper limit for one page is 2,000 objects.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 5
        example: 10
  responses:
    invalidPayload:
      description: Unprocessable Entity – invalid payload.
    unauthorizedError:
      description: Authentication information is missing or invalid.
      content:
        application/vnd.com.nsn.cumulocity.error+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: security/Unauthorized
            message: 'Invalid credentials! : Bad credentials'
            info: https://www.cumulocity.com/guides/reference-guide/#error_reporting
    operationNotAuthorized:
      description: Not authorized to perform this operation.
    inventoryBinariesCollectionFound:
      description: The request has succeeded and the managed objects are sent in the response.
      content:
        application/vnd.com.nsn.cumulocity.managedobjectcollection+json:
          schema:
            $ref: '#/components/schemas/BinaryCollection'
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: 'The authorization header is formed as `Basic <Base64(<tenantID>/<c8yuser>:<password>)>`. For instance, if your tenantID, username and password are **t0071234**, **testuser** and **secret123** respectively, you can generate the Base64 string with the following command:


        ```shell

        $ echo -n t0071234/testuser:secret123 | base64

        ```


        and your authorization header would look like this:


        ```

        "Authorization": "Basic dDAwNzEyMzQvdGVzdHVzZXI6c2VjcmV0MTIz"

        ```

        '
    OAI-Secure:
      type: http
      scheme: bearer
      description: 'This is the recommended authorization method because it provides high security using authorization tokens to prove the identity of the user, and it is the default login mode on creating new tenants. This mode is an enhancement of the previous OAuth Internal authentication (available prior to 10.13.0).


        For more details about OAI-Secure authentication, see [Platform administration > Authentication > Basic settings > Login settings](https://www.cumulocity.com/docs/authentication/basic-settings/#login-settings) in the Cumulocity user documentation.

        '
    SSO:
      type: oauth2
      description: "The login with SSO requires a correct configuration on the [Cumulocity side](https://www.cumulocity.com/docs/authentication/sso/). With the configuration, an additional button is available on the Login page. After clicking the button, the user is redirected to authenticate with the configured authorization server. On successful login, the user is redirected to Cumulocity.\n\nAuthentication details are exchanged using cookies. There are two parts to it, the first is the authentication cookie that is handled automatically by the Cumulocity platform. The second is the XSRF-TOKEN cookie. When a client receives the cookie, it should take the value and put it in the X-XSRF-TOKEN request header in all subsequent requests.\n\nThe flow of authenticating with authentication code grant is as follows:\n\n![Authentication flow](images/oauth-simple-flow.png)\n\nThe first request executed by the browser is:\n\n```http\nGET /tenant/loginOptions\nHost: https://<TENANT_DOMAIN>\nAccept: application/vnd.com.nsn.cumulocity.loginoptioncollection+json\n```\n\nResponse sample:\n\n```json\n{\n    \"loginOptions\": [\n        {\n            \"buttonName\": \"Login with oauth\",\n            \"grantType\": \"<AUTHORIZATION_CODE>\",\n            \"initRequest\": \"https://<TENANT_DOMAIN>/tenant/oauth?response_type=code&tenant_id=<TENANT_ID>\",\n            \"self\": \"https://<TENANT_DOMAIN>/tenant/loginOptions/oauth2\",\n            \"type\": \"oauth2\"\n        },\n        ...\n    ],\n    \"self\": \"http://<TENANT_DOMAIN>/tenant/loginOptions/\"\n}\n```\n\nThe browser must invoke the request provided in the initRequest parameter.\n\nThe initRequest initiates the redirect, in which the user is prompted for credentials. After successful login, the user is redirected back to the browser, where it must capture the code request parameter. Then the request to exchange the code for the token is as follows:\n\n```http\nPOST /tenant/oauth?grant_type=authorization_code&code=<CODE>\nHost: https://<TENANT_DOMAIN>\n```\n\nA successful response will have no body but the following response headers:\n\n```\nSet-Cookie: authorization=<TOKEN>;\nSet-Cookie: XSRF-TOKEN=<XSRF-TOKEN>;\n```\n\nThe authorization cookie is valid for two weeks.\n"
      flows:
        clientCredentials:
          tokenUrl: /tenant/oauth?grant_type=authorization_code&code=<CODE>
          scopes: {}
    JWT-IAM:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'This kind of authentication substitutes the JWT authentication with OAuth2 access tokens from your Identity and Access Management (IAM).

        You can enable this in the [SSO configuration](https://www.cumulocity.com/docs/authentication/sso/).


        The HTTP header must include:


        ```

        "Authorization": "Bearer <Access token>"

        ```


        When a request with a bearer token in the header is received, Cumulocity checks if the access token is from your IAM (that is, if authentication is enabled in your SSO configuration), and verifies the authenticity of

        the token remotely against the IAM.

        '

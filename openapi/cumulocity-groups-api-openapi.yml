openapi: 3.2.0
info:
  title: Cumulocity User Groups API
  version: 10.20.0
  description: 'Manage users, user groups, global roles, inventory roles, and device permissions. Cumulocity uses an

    RBAC model where global roles grant API access and inventory roles grant access to specific managed-object

    subtrees. Supports SSO via SAML/OIDC and SCIM provisioning for enterprise tenants.

    '
servers:
- url: https://{tenant}.cumulocity.com
  variables:
    tenant:
      default: example
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Groups
paths:
  /user/{tenantId}/groups:
    parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Groups
      summary: List Groups
      operationId: listGroups
      responses:
        '200':
          description: A collection of groups.
    post:
      tags:
      - Groups
      summary: Create a Group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/vnd.com.nsn.cumulocity.group+json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '201':
          description: Group created.
  /user/{tenantId}/groups/{groupId}:
    parameters:
    - name: tenantId
      in: path
      required: true
      schema:
        type: string
    - name: groupId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Groups
      summary: Retrieve a Group
      operationId: getGroup
      responses:
        '200':
          description: A single group.
    put:
      tags:
      - Groups
      summary: Update a Group
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/vnd.com.nsn.cumulocity.group+json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        '200':
          description: Group updated.
    delete:
      tags:
      - Groups
      summary: Delete a Group
      operationId: deleteGroup
      responses:
        '204':
          description: Group deleted.
components:
  schemas:
    Group:
      type: object
      properties:
        id:
          type: integer
        self:
          type: string
          format: uri
        name:
          type: string
        description:
          type: string
        roles:
          type: object
        users:
          type: object
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

        source: 'curl --location --request GET "https://<TENANT_DOMAIN>/tenant/options"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/tenant/options");

          client.Timeout = -1;


          var request = new RestRequest(Method.GET);


          IRestResponse response = client.Execute(request);


      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/event/events/{id}\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\"\n}\nresponse = requests.request(\"DELETE\", url, headers=headers)\nprint(response.text.encode(\"utf8\"))\n"

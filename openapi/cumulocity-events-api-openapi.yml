components:
  parameters:
    queryParam_event_withSourceChildren:
      name: withSourceChildren
      in: query
      description: When set to `true`, events for related source assets, devices and additions will also be included in the response. When this parameter is provided a `source` must be specified.
      schema:
        type: boolean
        default: false
        example: true
    processingModeHeader:
      name: X-Cumulocity-Processing-Mode
      in: header
      description: Used to explicitly control the processing mode of the request. See [Processing mode](#processing-mode) for more details.
      required: false
      schema:
        type: string
        default: PERSISTENT
        enum:
        - PERSISTENT
        - TRANSIENT
        - QUIESCENT
        - CEP
        example: PERSISTENT
    queryParam_withTotalElements:
      name: withTotalElements
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of elements. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalElements` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_event_withSourceAdditions:
      name: withSourceAdditions
      in: query
      description: When set to `true`, events for related source additions will also be included in the response. When this parameter is provided a `source` must be specified.
      schema:
        type: boolean
        default: false
        example: true
    queryParam_withTotalPages:
      name: withTotalPages
      in: query
      description: 'When set to `true`, the returned result will contain in the statistics object the total number of pages. Only applicable on [range queries](https://en.wikipedia.org/wiki/Range_query_(database)).

        > **&#9432; Info:** To improve performance, the `totalPages` statistics are cached for 10 seconds.

        '
      schema:
        type: boolean
        default: false
        example: true
    queryParam_lastUpdatedTo:
      name: lastUpdatedTo
      in: query
      description: End date or date and time of the last update made.
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2020-03-30'
    queryParam_event_dateFrom:
      name: dateFrom
      in: query
      description: Start date or date and time of the event occurrence (provided by the device).
      schema:
        type: string
        format: date-time
        minLength: 10
        example: '2020-03-01'
    queryParam_currentPage:
      name: currentPage
      in: query
      description: The current page of the paginated results.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 3
    queryParam_event_withSourceDevices:
      name: withSourceDevices
      in: query

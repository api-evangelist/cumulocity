openapi: 3.2.0
info:
  title: Cumulocity Application Application Binaries API
  version: 10.20.0
  description: 'Register, subscribe, configure, and upload Cumulocity microservices, hosted web applications, and plugins.

    Microservices run inside Cumulocity''s managed container runtime and authenticate via a bootstrap user

    issued by this API; web applications are uploaded as ZIPs and served from the tenant subdomain.

    '
servers:
- url: https://{tenant}.cumulocity.com
  variables:
    tenant:
      default: example
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Application Binaries
paths:
  /application/applications/{id}/binaries:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Application Binaries
      summary: List Application Binaries
      operationId: listApplicationBinaries
      responses:
        '200':
          description: A collection of application binaries.
    post:
      tags:
      - Application Binaries
      summary: Upload an Application Binary
      operationId: uploadApplicationBinary
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Binary uploaded.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

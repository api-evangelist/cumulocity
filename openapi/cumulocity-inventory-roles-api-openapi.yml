  /user/{tenantId}/users/{userId}/roles/inventory:
    parameters:
    - $ref: '#/components/parameters/tenantId'
    - $ref: '#/components/parameters/userId'
    post:
      operationId: postInventoryAssignmentResource
      x-codegen-resource-name: assignUserInventoryRole
      parameters:
      - $ref: '#/components/parameters/acceptHeader'
      tags:
      - Inventory Roles
      security:
      - Basic: []
      - OAI-Secure: []
      - SSO: []
      summary: Assign an inventory role to a user
      description: 'Assign an existing inventory role to a specific user (by a given user ID) in a specific tenant (by a given tenant ID).


        Required roles


        ROLE_USER_MANAGEMENT_ADMIN to assign any inventory role to root users in a user hierarchy OR users that are not in any hierarchy


        ROLE_USER_MANAGEMENT_ADMIN to assign inventory roles accessible by the parent of the assigned user to non-root users in a user hierarchy


        ROLE_USER_MANAGEMENT_CREATE to assign inventory roles accessible by the current user AND accessible by the parent of the assigned user to the descendants of the current user in a user hierarchy'
      requestBody:
        required: true
        content:
          application/vnd.com.nsn.cumulocity.inventoryassignment+json:
            example:
              managedObject: '1105'
              roles:
              - name: 'Operations: Restart Device'
            schema:
              allOf:
              - $ref: '#/components/schemas/inventoryAssignment'
              - required:
                - managedObject
                - roles
                properties:
                  roles:
                    items:
                      required:
                      - name
                      properties:
                        description:
                          readOnly: true
                        permissions:
                          readOnly: true
      x-code-samples:
      - lang: cURL
        source: 'curl --location --request POST "https://<TENANT_DOMAIN>/user/{tenantId}/users/{userId}/roles/inventory" \

          --header "Authorization: Basic <AUTHORIZATION>" \

          --header "Accept: application/json" \

          --header "Content-Type: application/json" \

          --data-raw "<Payload>"

          '
      - lang: C#
        source: 'var client = new RestClient("https://<TENANT_DOMAIN>/user/{tenantId}/users/{userId}/roles/inventory");

          client.Timeout = -1;


          var request = new RestRequest(Method.POST);

          request.AddHeader("Authorization", "Basic <AUTHORIZATION>");

          request.AddHeader("Content-Type", "application/json");

          request.AddHeader("Accept", "application/json");

          request.AddParameter("application/json", "<Payload>",  ParameterType.RequestBody);


          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);

          '
      - lang: Java
        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.post(\"https://<TENANT_DOMAIN>/user/{tenantId}/users/{userId}/roles/inventory\")\n    .header(\"Authorization\", \"Basic <AUTHORIZATION>\")\n    .header(\"Content-Type\", \"application/json\")\n    .header(\"Accept\", \"application/json\")\n    .body(\"<Payload>\")\n    .asString();\nSystem.out.println(response);\n"
      - lang: Node.js
        source: "var unirest = require(\"unirest\");\nvar req = unirest(\"POST\", \"https://<TENANT_DOMAIN>/user/{tenantId}/users/{userId}/roles/inventory\")\n    .headers({\n        \"Authorization\": \"Basic <AUTHORIZATION>\",\n        \"Accept\": \"application/json\",\n        \"Content-Type\": \"application/json\"\n    })\n    .send(JSON.stringify( <Payload> ))\n    .end(function (res) {\n        if (res.error) throw new Error(res.error);\n        console.log(res.raw_body);\n    });\n"
      - lang: Python
        source: "import requests\n\nurl = \"https://<TENANT_DOMAIN>/user/{tenantId}/users/{userId}/roles/inventory\"\nheaders = {\n  \"Authorization\": \"Basic <AUTHORIZATION>\",\n  \"Accept\": \"application/json\",\n  \"Content-Type\": \"application/json\"\n}\nresponse = requests.request(\"POST\", url, headers=headers, data = json.dumps(<Payload>))\nprint(response.text.encode(\"utf8\"))\n"
      responses:
        '200':
          description: An inventory role was assigned to a user.
          content:
            application/vnd.com.nsn.cumulocity.inventoryassignment+json:
              schema:
                $ref: '#/components/schemas/inventoryAssignment'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/accessDenied'
        '404':
          $ref: '#/components/responses/userNotFound'
        '422':
          $ref: '#/components/responses/invalidPayload'

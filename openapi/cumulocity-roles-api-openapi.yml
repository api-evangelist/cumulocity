        '404':
          $ref: '#/components/responses/userNotFound'
components:
  parameters:
    userId:
      name: userId
      in: path
      description: Unique identifier of the a user.
      required: true
      schema:
        type: string
        minLength: 1
        example: jdoe
    queryParam_withTotalElements:

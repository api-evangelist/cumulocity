openapi: 3.2.0
info:
  title: Cumulocity Edge System API
  version: 10.18.0
  description: 'Single-node on-premises deployment of Cumulocity that runs the full platform locally (inventory,

    events, measurements, alarms, streaming analytics, UI) and optionally syncs selected data to a cloud

    tenant. Targets factory floors, vessels, and regulated/air-gapped environments.

    '
servers:
- url: https://edge.local
- url: https://{edgeHost}
  variables:
    edgeHost:
      default: edge.local
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: System
paths:
  /service/edge/system:
    get:
      tags:
      - System
      summary: Retrieve Edge System Status
      operationId: getEdgeSystemStatus
      responses:
        '200':
          description: System status including version, uptime, disk, and service health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeSystemStatus'
  /service/edge/system/restart:
    post:
      tags:
      - System
      summary: Restart the Edge System
      operationId: restartEdge
      responses:
        '202':
          description: Restart requested.
components:
  schemas:
    EdgeSystemStatus:
      type: object
      properties:
        version:
          type: string
        edition:
          type: string
          enum:
          - CONNECTED
          - AIR_GAPPED
        uptime:
          type: integer
          description: Seconds since boot.
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum:
                - RUNNING
                - STOPPED
                - FAILED
        storage:
          type: object
          properties:
            totalBytes:
              type: integer
            usedBytes:
              type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
